<!DOCTYPE html>
<!--
  ============================================================================
   Crash Dump Analyzer 1.4.0   (named "Crash Dump Viewer" up to 1.2.1)
   Offline, single-file viewer for Windows minidump (.dmp) files.
  ============================================================================

   WHAT IT IS
   ----------
   One self-contained HTML file. Open it in Chrome / Edge / Firefox, drop one
   or more .dmp files on it and it shows:
     - a human-readable diagnosis (what crashed, who is the likely culprit,
       what to do), in English or Spanish;
     - the raw technical data (exception record, registers, threads, heuristic
       stack scan, modules with versions/PDB ids, system/process info, stream
       directory);
     - a comparison across all loaded dumps (repeat offenders);
     - plain-text (.txt) export of everything.
   1.1.0 adds: process/system memory at the moment of the crash, risk
   warnings (VST2+VST3 duplicates, old binaries, legacy plugins), "what was
   the application doing" (activity), an all-threads overview (waiting /
   running / possible deadlock), a timeline and plugin-version history in the
   comparison, a support summary for vendors, anonymised exports, opening a
   whole folder (button or drag & drop), watching a folder for new dumps
   (File System Access API), and EXACT x64 stack unwinding when the user also
   drops the .dll/.vst3/.exe files of the modules involved (PE .pdata/.xdata).
   1.2.0 adds: decoding of the faulting x64 instruction (which register held the
   bad pointer, virtual-call detection), module changes between dumps (first
   seen / updated, incl. drivers), personal notes per plugin (JSON import/
   export, kept only in memory), CSV and JSON export, and stronger
   anonymisation (non-standard folders are replaced by <folder>).
   1.2.1 adds: application icon (favicon + header logo, inline SVG, no files)
   and a "Where are the dumps?" panel with the typical folders (generic
   %USERPROFILE% / %LOCALAPPDATA% paths, no user name inside the page).
   1.3.0: renamed to "Crash Dump Analyzer" (file CrashDumpAnalyzer.html). Notes
   files now use format "crash-dump-analyzer-notes"; the old
   "crash-dump-viewer-notes" files are still accepted on import.
   1.4.0 adds: crash signatures (same bug = same signature), C++ exception type
   names (std::bad_alloc ...), "fix first" ranking in the comparison, printable
   report (Print / PDF), self-contained anonymised HTML report export, built-in
   synthetic demo dumps (fictional software, no real data) and a German UI.

   PRIVACY / OFFLINE GUARANTEE
   ---------------------------
   - No external scripts, fonts, images or styles. Everything is inline.
   - The Content-Security-Policy below sets connect-src 'none': the page is
     technically unable to open network connections (fetch/XHR/WebSocket).
   - Files are read locally with the File API (FileReader / arrayBuffer) and
     never leave the browser. Nothing is stored (no localStorage/cookies).

   CODE LAYOUT (inside the <script> blocks at the end)
   ---------------------------------------------------
   Block 1  "CORE"  (between the CORE-BEGIN / CORE-END markers)
            Pure JavaScript, no DOM access. Can be loaded in Node.js for
            testing (it exports itself through module.exports).
            1.  Constants (stream ids, exception codes, flags)
            2.  I18N dictionary (en / es) and t() translator
            3.  Reader: bounds-checked little-endian binary reader
            4.  Stream parsers (one function per MINIDUMP stream)
            5.  parseMinidump(): header + stream directory + dispatch
            6.  Address helpers: module lookup, memory read, symbolize
            7.  Module classification (plugin / driver / Windows / host ...)
            8.  Heuristic stack scan
            8b. PE reader (exports, .pdata) + exact x64 unwinder
            8c. x64 instruction decoder (faulting instruction)
            9.  analyze(): turns parsed data into a diagnosis
                (memory, warnings, activity, all-threads overview)
            10. compare(): cross-dump statistics, timeline, version history
            11. Plain-text report builders, support summary, anonymiser
   Block 2  "UI"
            State, file loading, rendering of every tab, export buttons.

   FORMAT REFERENCE
   ----------------
   Microsoft "minidumpapiset.h" (MINIDUMP_HEADER, MINIDUMP_DIRECTORY,
   MINIDUMP_PROCESS_VM_COUNTERS_1/2, MINIDUMP_SYSTEM_MEMORY_INFO_1,
   MINIDUMP_THREAD, MINIDUMP_MODULE, MINIDUMP_EXCEPTION_STREAM,
   MINIDUMP_SYSTEM_INFO, MINIDUMP_MISC_INFO_1..5, MINIDUMP_MEMORY_LIST,
   MINIDUMP_MEMORY64_LIST, MINIDUMP_THREAD_INFO_LIST,
   MINIDUMP_UNLOADED_MODULE_LIST, MINIDUMP_THREAD_NAME_LIST) and
   "winnt.h" (CONTEXT for x86 / AMD64 / ARM64, IMAGE_* PE headers,
   RUNTIME_FUNCTION / UNWIND_INFO / UNWIND_CODE for x64 exception handling).
   All structures are little-endian and packed (#pragma pack(4)).
  ============================================================================
-->

<style>
/* ---------------------------------------------------------------------------
   THEME TOKENS. Light by default, dark when the OS prefers dark.
   --------------------------------------------------------------------------- */
:root{
  --bg:#f5f6f8; --panel:#ffffff; --panel2:#eef0f3; --text:#1b1f24; --muted:#5d6670;
  --border:#d6dae0; --accent:#2f6fd6; --accent-weak:#e3ecfb;
  --crash:#c62828; --crash-weak:#fdecec; --hang:#b26a00; --hang-weak:#fff4e0;
  --ok:#2e7d32; --ok-weak:#e8f5e9; --mono:Consolas,"Cascadia Mono","SFMono-Regular",Menlo,monospace;

}

  :root{
    --bg:#15181c; --panel:#1d2126; --panel2:#262b31; --text:#e6e8eb; --muted:#9aa4ae;
    --border:#343a42; --accent:#6ea2ff; --accent-weak:#1f2d45;
    --crash:#ff6b6b; --crash-weak:#3a1f22; --hang:#ffb547; --hang-weak:#3a2d17;

}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--sans)}
button,select,input{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;

header h1 svg.logo{width:28px;height:28px;flex:none}

.where li{margin:6px 0}
aside details{font-size:12px;margin-top:10px}
aside details summary{cursor:pointer;color:var(--accent)}
header h1 small{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.spacer{flex:1}
.btn{border:1px solid var(--border);background:var(--panel2);padding:6px 12px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel2);padding:6px 10px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
#layout{display:grid;grid-template-columns:280px 1fr;min-height:calc(100% - 56px)}
@media (max-width:820px){#layout{grid-template-columns:1fr}}
aside{border-right:1px solid var(--border);padding:12px;background:var(--panel)}
main{padding:16px;min-width:0}
.list-item{border:1px solid var(--border);border-left:4px solid var(--border);border-radius:6px;padding:8px 10px;
  margin-bottom:8px;cursor:pointer;background:var(--panel)}
.list-item.sel{outline:2px solid var(--accent)}
.list-item.crash{border-left-color:var(--crash)} .list-item.hang{border-left-color:var(--hang)}
.list-item.snapshot{border-left-color:var(--accent)} .list-item.error{border-left-color:var(--muted);opacity:.8}
.list-item .f{font-weight:600;word-break:break-all;font-size:12.5px}
.list-item .s{color:var(--muted);font-size:12px}
.drop{border:2px dashed var(--border);border-radius:10px;padding:36px 16px;text-align:center;color:var(--muted);background:var(--panel)}
.drop strong{display:block;color:var(--text);font-size:16px;margin-bottom:6px}
body.dragging .drop, body.dragging aside{outline:3px dashed var(--accent);outline-offset:-6px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted)}
.tabs button.on{border-bottom-color:var(--accent);color:var(--text);font-weight:600}
.card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px}
.card h3{font-size:13px;margin:12px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.verdict{border-left:6px solid var(--accent)}
.verdict.crash{border-left-color:var(--crash);background:var(--crash-weak)}
.verdict.hang{border-left-color:var(--hang);background:var(--hang-weak)}
.verdict .big{font-size:18px;font-weight:650;margin-bottom:4px}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--border);background:var(--panel2);margin:2px 4px 2px 0}
.pill.high{background:var(--crash-weak);border-color:var(--crash)} .pill.medium{background:var(--hang-weak);border-color:var(--hang)}
.pill.low{background:var(--panel2)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px}
.kv div:nth-child(odd){color:var(--muted)}
.mono,code,pre{font-family:var(--mono);font-size:12.5px}
pre{background:var(--panel2);padding:10px;border-radius:6px;overflow:auto;margin:6px 0}
ul.clean{margin:0;padding-left:20px} ul.clean li{margin:4px 0}
.tablewrap{overflow:auto;max-height:70vh;border:1px solid var(--border);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:5px 8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--panel2);z-index:1;white-space:nowrap}
tr.hl td{background:var(--accent-weak)}
tr.k-system td,tr.k-runtime td{color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.toolbar input[type=search]{padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--panel);min-width:240px}
.muted{color:var(--muted)} .warn{color:var(--hang)} .err{color:var(--crash)}
.bar{height:10px;background:var(--accent);border-radius:3px;display:inline-block;vertical-align:middle;margin-right:6px}
.chk{display:inline-flex;align-items:center;gap:4px;font-size:13px;cursor:pointer}
.status{font-size:12px;color:var(--muted);margin-bottom:8px}
.status div{margin-bottom:4px}
textarea.support{width:100%;min-height:360px;font-family:var(--mono);font-size:12.5px;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:10px}
svg.timeline{width:100%;height:auto;display:block}
svg.timeline text{fill:var(--muted);font:11px var(--sans)}
svg.timeline .lane{stroke:var(--border)}
.warncard{border-left:6px solid var(--hang)}
#printArea{display:none}
@media print{
  body > *:not(#printArea){display:none !important}
  #printArea{display:block}
  @page{margin:12mm}
}
.sig{font-family:var(--mono);font-size:12px}
footer{color:var(--muted);font-size:12px;padding:16px;text-align:center}
</style>

<script>
/*CORE-BEGIN*/
/* ============================================================================
 * CORE — minidump parser + analyzer + report builder.
 * Pure functions, no DOM. Exposed as the global object `CDV`.
 * ========================================================================== */
const CDV = (function () {
'use strict';

const VERSION = '1.4.0';

/* ----------------------------------------------------------------------------
 * 1. CONSTANTS
 * ------------------------------------------------------------------------- */

/** 'MDMP' read as a little-endian uint32 — first 4 bytes of every minidump. */
const MDMP_SIGNATURE = 0x504D444D;

/** MINIDUMP_STREAM_TYPE values -> readable names (minidumpapiset.h). */
const STREAM_NAMES = {
  0:'Unused', 1:'Reserved0', 2:'Reserved1', 3:'ThreadList', 4:'ModuleList', 5:'MemoryList',
  6:'Exception', 7:'SystemInfo', 8:'ThreadExList', 9:'Memory64List', 10:'CommentA',
  11:'CommentW', 12:'HandleData', 13:'FunctionTable', 14:'UnloadedModuleList', 15:'MiscInfo',
  16:'MemoryInfoList', 17:'ThreadInfoList', 18:'HandleOperationList', 19:'Token',
  20:'JavaScriptData', 21:'SystemMemoryInfo', 22:'ProcessVmCounters', 23:'IptTrace', 24:'ThreadNames'
};

/** MINIDUMP_TYPE flags stored in MINIDUMP_HEADER.Flags: what the writer captured. */
const DUMP_FLAGS = [
  [0x1,'WithDataSegs'],[0x2,'WithFullMemory'],[0x4,'WithHandleData'],[0x8,'FilterMemory'],
  [0x10,'ScanMemory'],[0x20,'WithUnloadedModules'],[0x40,'WithIndirectlyReferencedMemory'],
  [0x80,'FilterModulePaths'],[0x100,'WithProcessThreadData'],[0x200,'WithPrivateReadWriteMemory'],
  [0x400,'WithoutOptionalData'],[0x800,'WithFullMemoryInfo'],[0x1000,'WithThreadInfo'],
  [0x2000,'WithCodeSegs'],[0x4000,'WithoutAuxiliaryState'],[0x8000,'WithFullAuxiliaryState'],
  [0x10000,'WithPrivateWriteCopyMemory'],[0x20000,'IgnoreInaccessibleMemory'],
  [0x40000,'WithTokenInformation'],[0x80000,'WithModuleHeaders'],[0x100000,'FilterTriage'],
  [0x200000,'WithAvxXStateContext'],[0x400000,'WithIptTrace'],[0x800000,'ScanInaccessiblePartialPages']
];

/** PROCESSOR_ARCHITECTURE_* values (MINIDUMP_SYSTEM_INFO.ProcessorArchitecture). */
const ARCH = { 0:'x86', 5:'ARM', 6:'IA64', 9:'x64', 12:'ARM64', 0xFFFF:'unknown' };

/** Windows exception / NTSTATUS codes -> symbolic name.
 *  The human explanation lives in I18N under key 'exc.<HEX>'. */
const EXC_NAMES = {
  0xC0000005:'ACCESS_VIOLATION', 0xC0000006:'IN_PAGE_ERROR', 0xC000001D:'ILLEGAL_INSTRUCTION',
  0xC0000025:'NONCONTINUABLE_EXCEPTION', 0xC000008C:'ARRAY_BOUNDS_EXCEEDED',
  0xC000008E:'FLOAT_DIVIDE_BY_ZERO', 0xC0000090:'FLOAT_INVALID_OPERATION',
  0xC0000094:'INTEGER_DIVIDE_BY_ZERO', 0xC0000095:'INTEGER_OVERFLOW',
  0xC0000096:'PRIVILEGED_INSTRUCTION', 0xC00000FD:'STACK_OVERFLOW', 0xC0000135:'DLL_NOT_FOUND',
  0xC0000142:'DLL_INIT_FAILED', 0xC0000194:'POSSIBLE_DEADLOCK', 0xC0000374:'HEAP_CORRUPTION',
  0xC0000409:'STACK_BUFFER_OVERRUN (FAST_FAIL)', 0xC0000417:'INVALID_CRUNTIME_PARAMETER',
  0xC0000420:'ASSERTION_FAILURE', 0xC000041D:'FATAL_USER_CALLBACK_EXCEPTION',
  0xE06D7363:'C++ EXCEPTION (MSVC)', 0xE0434352:'.NET CLR EXCEPTION', 0x80000003:'BREAKPOINT',
  0x80000004:'SINGLE_STEP', 0x40000015:'FATAL_APP_EXIT', 0x80000002:'DATATYPE_MISALIGNMENT'
};

/** __fastfail() codes carried in ExceptionInformation[0] of 0xC0000409 (winnt.h FAST_FAIL_*). */
const FAST_FAIL = {
  0:'LEGACY_GS_VIOLATION', 1:'VTGUARD_CHECK_FAILURE', 2:'STACK_COOKIE_CHECK_FAILURE',
  3:'CORRUPT_LIST_ENTRY', 4:'INCORRECT_STACK', 5:'INVALID_ARG', 6:'GS_COOKIE_INIT',
  7:'FATAL_APP_EXIT', 8:'RANGE_CHECK_FAILURE', 9:'UNSAFE_REGISTRY_ACCESS',
  10:'GUARD_ICALL_CHECK_FAILURE', 11:'GUARD_WRITE_CHECK_FAILURE', 12:'INVALID_FIBER_SWITCH',
  13:'INVALID_SET_OF_CONTEXT', 14:'INVALID_REFERENCE_COUNT', 18:'INVALID_JUMP_BUFFER',
  19:'MRDATA_MODIFIED', 20:'CERTIFICATION_FAILURE', 21:'INVALID_EXCEPTION_CHAIN',
  22:'CRYPTO_LIBRARY', 23:'INVALID_CALL_IN_DLL_CALLOUT'
};

/** Process integrity level RIDs (MINIDUMP_MISC_INFO_3.ProcessIntegrityLevel). */
const INTEGRITY = { 0:'Untrusted', 0x1000:'Low', 0x2000:'Medium', 0x2100:'Medium+', 0x3000:'High (administrator)', 0x4000:'System' };

/** Known Windows 10/11 build numbers -> marketing release name. */
const WIN_BUILDS = { 10240:'1507',10586:'1511',14393:'1607',15063:'1703',16299:'1709',17134:'1803',
  17763:'1809',18362:'1903',18363:'1909',19041:'2004',19042:'20H2',19043:'21H1',19044:'21H2',19045:'22H2',
  22000:'21H2',22621:'22H2',22631:'23H2',26100:'24H2',26200:'25H2' };

/** Vendor detection: regex tested against the lower-cased full module path.

/**
 * Translate `key` into `lang`, falling back to English, then to the key itself.
 * {placeholders} are replaced with vars[name]; values starting with '@' are
 * translated recursively (lets analysis results stay language-neutral).
 */
function t(lang, key, vars) {
  let s = (I18N[lang] && I18N[lang][key]) ?? I18N.en[key] ?? key;
  if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => {
    if (vars[k] === undefined || vars[k] === null) return m;
    const one = (x) => { const v = String(x); return v.startsWith('@') ? t(lang, v.slice(1)) : v; };
    // Arrays are rendered as a comma-separated list, each item translated if it is an '@key'.
    return Array.isArray(vars[k]) ? vars[k].map(one).join(', ') : one(vars[k]);
  });
  return s;
}

/* ----------------------------------------------------------------------------
 * Small formatting helpers (shared by UI and text reports).
 * ------------------------------------------------------------------------- */

/** BigInt|Number -> '0x' + zero-padded hex. width = hex digits (16 for x64, 8 for x86). */
function hex(v, width) {
  if (v === undefined || v === null) return '';
  const s = (typeof v === 'bigint' ? v : BigInt(v >>> 0)).toString(16).toUpperCase();
  return '0x' + (width ? s.padStart(width, '0') : s);
}
/** 32-bit code -> 8-digit hex without prefix (key format of 'exc.*'). */
function hex8(n) { return (n >>> 0).toString(16).toUpperCase().padStart(8, '0'); }
/** Bytes -> "1.23 MB". */
function fmtSize(n) {
  if (n < 1024) return n + ' B';
  const u = ['KB','MB','GB','TB']; let i = -1;
  do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
  return n.toFixed(n < 10 ? 2 : 1) + ' ' + u[i];
}
/** Unix seconds -> "YYYY-MM-DD HH:MM:SS" in the viewer's local time zone. */
function fmtTime(sec) {
  if (!sec) return '';
  const d = new Date(sec * 1000); const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
/** Seconds -> "3h 12m 05s". */
function fmtDur(sec) {
  if (sec === undefined || sec === null || sec < 0) return '';
  sec = Math.round(sec);
  const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  const p = n => String(n).padStart(2, '0');
  return (d ? d + 'd ' : '') + (d || h ? h + 'h ' : '') + p(m) + 'm ' + p(s) + 's';
}
/** Windows FILETIME (100 ns ticks since 1601-01-01, BigInt) -> Unix seconds. */
function filetimeToUnix(ft) {
  if (!ft) return 0;
  return Number(ft / 10000000n) - 11644473600;
}
/** FILETIME duration (100 ns ticks) -> seconds (Number). */
function ticksToSec(ft) { return ft ? Number(ft / 10000n) / 1000 : 0; }

/* ----------------------------------------------------------------------------
 * 3. READER — bounds-checked little-endian reads over an ArrayBuffer.
 *    Every structure in a minidump is addressed by an RVA (offset from the
 *    start of the file). All reads go through here so that a truncated or
 *    corrupted file throws a clear error instead of returning garbage.
 * ------------------------------------------------------------------------- */
class Reader {
  constructor(buffer) {
    this.buf = buffer;
    this.dv = new DataView(buffer);
    this.len = buffer.byteLength;
    this.u16le = new TextDecoder('utf-16le');
    this.latin = new TextDecoder('utf-8', { fatal: false });
  }
  /** True when [off, off+n) is inside the file. */
  has(off, n) { return Number.isInteger(off) && off >= 0 && n >= 0 && off + n <= this.len; }
  need(off, n) { if (!this.has(off, n)) throw new Error(`read out of file bounds @${off} (+${n})`); }
  u8(o)  { this.need(o, 1); return this.dv.getUint8(o); }
  u16(o) { this.need(o, 2); return this.dv.getUint16(o, true); }
  u32(o) { this.need(o, 4); return this.dv.getUint32(o, true); }
  i32(o) { this.need(o, 4); return this.dv.getInt32(o, true); }
  u64(o) { this.need(o, 8); return this.dv.getBigUint64(o, true); }
  /** u64 converted to Number (only for sizes/RVAs that fit in 2^53). */
  u64n(o) { return Number(this.u64(o)); }
  bytes(o, n) { this.need(o, n); return new Uint8Array(this.buf, o, n); }
  /** UTF-16LE string of byteLen bytes, trailing NULs removed. */
  utf16(o, byteLen) { return this.u16le.decode(this.bytes(o, byteLen & ~1)).replace(/\0+$/, '').replace(/\0.*$/s, ''); }
  /** MINIDUMP_STRING at rva: { ULONG32 Length (bytes, no terminator); WCHAR Buffer[] }. */
  mdString(rva) {
    if (!rva || !this.has(rva, 4)) return '';
    const n = this.u32(rva);
    if (!this.has(rva + 4, n)) return '';
    return this.utf16(rva + 4, n);
  }
  /** NUL-terminated 8-bit string, at most max bytes. */
  cstr(o, max) {
    const n = Math.min(max, this.len - o); if (n <= 0) return '';
    const b = this.bytes(o, n); let e = b.indexOf(0); if (e < 0) e = n;
    return this.latin.decode(b.subarray(0, e));
  }
}

/* ----------------------------------------------------------------------------
 * 4. STREAM PARSERS
 *    Signature for all: (r: Reader, d: dump object, s: directory entry).
 *    Each one fills a field of `d`. Offsets in comments are relative to the
 *    start of the structure being read.
 * ------------------------------------------------------------------------- */

/** CONTEXT record -> { arch, ptrSize, ip, sp, fp, regs:[[name, BigInt]] }.
 *  Layouts (winnt.h):
 *   AMD64  : Rax@0x78 Rcx@0x80 Rdx@0x88 Rbx@0x90 Rsp@0x98 Rbp@0xA0 Rsi@0xA8 Rdi@0xB0
 *            R8..R15@0xB8..0xF0 Rip@0xF8 EFlags(u32)@0x44   (struct size 0x4D0)
 *   x86    : Edi@0x9C Esi@0xA0 Ebx@0xA4 Edx@0xA8 Ecx@0xAC Eax@0xB0 Ebp@0xB4 Eip@0xB8
 *            EFlags@0xC0 Esp@0xC4                             (struct size 0x2CC)
 *   ARM64  : X0..X28@0x08.. Fp@0xF0 Lr@0xF8 Sp@0x100 Pc@0x108 (struct size 0x390) */
function parseContext(r, rva, size, archId) {
  if (!rva || !size) return null;
  if (archId === 9 && size >= 0x100 && r.has(rva, 0x100)) {
    const g = o => r.u64(rva + o);
    const names = [['rax',0x78],['rbx',0x90],['rcx',0x80],['rdx',0x88],['rsi',0xA8],['rdi',0xB0],['rbp',0xA0],['rsp',0x98],
                   ['r8',0xB8],['r9',0xC0],['r10',0xC8],['r11',0xD0],['r12',0xD8],['r13',0xE0],['r14',0xE8],['r15',0xF0],['rip',0xF8]];
    return { arch:'x64', ptrSize:8, ip:g(0xF8), sp:g(0x98), fp:g(0xA0), flags:r.u32(rva+0x44), regs:names.map(([n,o]) => [n, g(o)]) };
  }
  if (archId === 0 && size >= 0xC8 && r.has(rva, 0xC8)) {
    const g = o => BigInt(r.u32(rva + o));
    const names = [['eax',0xB0],['ebx',0xA4],['ecx',0xAC],['edx',0xA8],['esi',0xA0],['edi',0x9C],['ebp',0xB4],['esp',0xC4],['eip',0xB8]];
    return { arch:'x86', ptrSize:4, ip:g(0xB8), sp:g(0xC4), fp:g(0xB4), flags:r.u32(rva+0xC0), regs:names.map(([n,o]) => [n, g(o)]) };
  }
  if (archId === 12 && size >= 0x110 && r.has(rva, 0x110)) {
    const g = o => r.u64(rva + o);
    const regs = [];
    for (let i = 0; i <= 28; i++) regs.push(['x' + i, g(8 + i * 8)]);
    regs.push(['fp', g(0xF0)], ['lr', g(0xF8)], ['sp', g(0x100)], ['pc', g(0x108)]);
    return { arch:'ARM64', ptrSize:8, ip:g(0x108), sp:g(0x100), fp:g(0xF0), flags:r.u32(rva+4), regs };
  }
  return null;
}

/** SystemInfoStream (7): MINIDUMP_SYSTEM_INFO
 *  +0 u16 ProcessorArchitecture  +2 u16 ProcessorLevel  +4 u16 ProcessorRevision
 *  +6 u8 NumberOfProcessors      +7 u8 ProductType (1 workstation, 2 DC, 3 server)
 *  +8 u32 MajorVersion +12 Minor +16 BuildNumber +20 PlatformId +24 CSDVersionRva
 *  +28 u16 SuiteMask +30 u16 Reserved2 +32 CPU_INFORMATION (x86: VendorId[3] ...) */
function parseSystemInfo(r, d, s) {
  const o = s.rva;
  const si = {
    archId: r.u16(o), level: r.u16(o + 2), revision: r.u16(o + 4), cpus: r.u8(o + 6), productType: r.u8(o + 7),
    major: r.u32(o + 8), minor: r.u32(o + 12), build: r.u32(o + 16), platformId: r.u32(o + 20),
    csd: r.mdString(r.u32(o + 24)), suiteMask: r.u16(o + 28), vendor: ''
  };
  si.arch = ARCH[si.archId] || ('arch ' + si.archId);
  if ((si.archId === 0 || si.archId === 9) && r.has(o + 32, 12)) si.vendor = r.cstr(o + 32, 12);
  // Human OS name: NT 10.0 covers Windows 10 and 11 (11 starts at build 22000).
  if (si.major === 10) {
    const name = si.productType === 1 ? (si.build >= 22000 ? 'Windows 11' : 'Windows 10') : 'Windows Server';
    si.osName = `${name}${WIN_BUILDS[si.build] ? ' ' + WIN_BUILDS[si.build] : ''} (build ${si.build})`;
  } else si.osName = `Windows NT ${si.major}.${si.minor} (build ${si.build})`;
  d.system = si;
}

/** ModuleListStream (4): u32 NumberOfModules, then MINIDUMP_MODULE[108 bytes]:
 *  +0 u64 BaseOfImage +8 u32 SizeOfImage +12 CheckSum +16 TimeDateStamp +20 ModuleNameRva
 *  +24 VS_FIXEDFILEINFO (52 bytes: +0 sig 0xFEEF04BD, +8 FileVersionMS, +12 FileVersionLS,
 *      +16 ProductVersionMS, +20 ProductVersionLS, +28 FileFlags, +36 FileType)
 *  +76 CvRecord {u32 DataSize, u32 Rva}  +84 MiscRecord  +92 u64 Reserved0  +100 u64 Reserved1
 *  CvRecord 'RSDS' (CV_INFO_PDB70): +0 sig, +4 GUID[16], +20 u32 Age, +24 char PdbFileName[] */
function parseModules(r, d, s) {
  const n = r.u32(s.rva);
  for (let i = 0; i < n; i++) {
    const o = s.rva + 4 + i * 108;
    if (!r.has(o, 108)) { d.warnings.push(`ModuleList truncated at entry ${i}`); break; }
    const path = r.mdString(r.u32(o + 20));
    const m = {
      base: r.u64(o), size: r.u32(o + 8), checksum: r.u32(o + 12), timestamp: r.u32(o + 16),
      path, name: path.split(/[\\/]/).pop() || path, fileVersion: '', productVersion: '', pdb: '', pdbId: ''
    };
    m.end = m.base + BigInt(m.size);
    if (r.u32(o + 24) === 0xFEEF04BD) {
      const v = (ms, ls) => `${ms >>> 16}.${ms & 0xFFFF}.${ls >>> 16}.${ls & 0xFFFF}`;
      m.fileVersion = v(r.u32(o + 32), r.u32(o + 36));
      m.productVersion = v(r.u32(o + 40), r.u32(o + 44));
    }
    const cvSize = r.u32(o + 76), cvRva = r.u32(o + 80);
    if (cvSize >= 24 && r.has(cvRva, 24) && r.u32(cvRva) === 0x53445352 /* 'RSDS' */) {
      const g = r.bytes(cvRva + 4, 16), hx = b => b.toString(16).padStart(2, '0').toUpperCase();
      // GUID: Data1 (u32 LE), Data2 (u16 LE), Data3 (u16 LE), Data4[8] — symbol-server id = GUID + Age.
      const guid = [3,2,1,0].map(k => hx(g[k])).join('') + [5,4].map(k => hx(g[k])).join('') +
                   [7,6].map(k => hx(g[k])).join('') + Array.from(g.subarray(8)).map(hx).join('');
      m.pdbId = guid + r.u32(cvRva + 20).toString(16).toUpperCase();
      m.pdb = r.cstr(cvRva + 24, cvSize - 24);
    }
    d.modules.push(m);
  }
}

/** UnloadedModuleListStream (14): header {u32 SizeOfHeader, u32 SizeOfEntry, u32 NumberOfEntries}
 *  entries MINIDUMP_UNLOADED_MODULE: +0 u64 Base +8 u32 Size +12 CheckSum +16 TimeDateStamp +20 NameRva */
function parseUnloaded(r, d, s) {
  const hs = r.u32(s.rva), es = r.u32(s.rva + 4), n = r.u32(s.rva + 8);
  for (let i = 0; i < n; i++) {
    const o = s.rva + hs + i * es;
    if (!r.has(o, 24)) break;
    const path = r.mdString(r.u32(o + 20));
    const base = r.u64(o), size = r.u32(o + 8);
    d.unloaded.push({ base, size, end: base + BigInt(size), timestamp: r.u32(o + 16), path, name: path.split(/[\\/]/).pop() || path });
  }
}

/** MemoryListStream (5): u32 Count, then MINIDUMP_MEMORY_DESCRIPTOR[16]:
 *  +0 u64 StartOfMemoryRange +8 u32 DataSize +12 u32 Rva  (data stored at Rva in the file). */
function parseMemList(r, d, s) {
  const n = r.u32(s.rva);
  for (let i = 0; i < n; i++) {
    const o = s.rva + 4 + i * 16;
    if (!r.has(o, 16)) break;
    d.memory.push({ start: r.u64(o), size: r.u32(o + 8), rva: r.u32(o + 12) });
  }
}

/** Memory64ListStream (9) — used by full-memory dumps:
 *  +0 u64 Count +8 u64 BaseRva, then MINIDUMP_MEMORY_DESCRIPTOR64[16] {u64 Start, u64 DataSize}.
 *  Data of all ranges is stored back-to-back starting at BaseRva. */
function parseMem64(r, d, s) {

  for (let i = 0; i < n; i++) {
    const o = s.rva + 16 + i * 16;
    if (!r.has(o, 16)) break;
    const size = r.u64n(o + 8);
    d.memory.push({ start: r.u64(o), size, rva });
    rva += size;
  }
}

/** ThreadListStream (3): u32 Count, then MINIDUMP_THREAD[48]:
 *  +0 u32 ThreadId +4 SuspendCount +8 PriorityClass +12 Priority +16 u64 Teb
 *  +24 Stack MINIDUMP_MEMORY_DESCRIPTOR {u64 Start, u32 Size, u32 Rva}
 *  +40 ThreadContext {u32 DataSize, u32 Rva} */
function parseThreads(r, d, s) {
  const n = r.u32(s.rva), archId = d.system ? d.system.archId : 9;
  for (let i = 0; i < n; i++) {
    const o = s.rva + 4 + i * 48;
    if (!r.has(o, 48)) { d.warnings.push(`ThreadList truncated at entry ${i}`); break; }
    const th = {
      index: i, id: r.u32(o), suspend: r.u32(o + 4), priorityClass: r.u32(o + 8), priority: r.i32(o + 12),
      teb: r.u64(o + 16), stackStart: r.u64(o + 24), stackSize: r.u32(o + 32), stackRva: r.u32(o + 36),
      ctxSize: r.u32(o + 40), ctxRva: r.u32(o + 44)

    try { th.ctx = parseContext(r, th.ctxRva, th.ctxSize, archId); } catch (e) { th.ctx = null; }
    // Thread stacks are also memory: register them so readMem() can find them.
    // Some writers (e.g. Steinberg's in-process dumper) leave Stack.Rva = 0 and store
    // the stack only in MemoryList; RVA 0 would point at the file header, so skip it.
    if (th.stackSize && th.stackRva && r.has(th.stackRva, th.stackSize)) d.memory.push({ start: th.stackStart, size: th.stackSize, rva: th.stackRva });
    d.threads.push(th);
  }
}

/** ThreadInfoListStream (17): {u32 SizeOfHeader, u32 SizeOfEntry, u32 Count}, MINIDUMP_THREAD_INFO:
 *  +0 ThreadId +4 DumpFlags +8 DumpError +12 ExitStatus +16 u64 CreateTime +24 ExitTime
 *  +32 KernelTime +40 UserTime +48 u64 StartAddress +56 u64 Affinity   (times = FILETIME) */
function parseThreadInfo(r, d, s) {
  const hs = r.u32(s.rva), es = r.u32(s.rva + 4), n = r.u32(s.rva + 8);
  for (let i = 0; i < n; i++) {
    const o = s.rva + hs + i * es;
    if (!r.has(o, 64)) break;
    d.threadInfo.set(r.u32(o), {
      dumpFlags: r.u32(o + 4), dumpError: r.u32(o + 8), exitStatus: r.u32(o + 12),
      createTime: r.u64(o + 16), exitTime: r.u64(o + 24), kernelTime: r.u64(o + 32), userTime: r.u64(o + 40),
      startAddress: r.u64(o + 48), affinity: r.u64(o + 56)
    });
  }

/** ThreadNamesStream (24): u32 Count, then {u32 ThreadId, u64 RvaOfThreadName} (12 bytes, packed). */
function parseThreadNames(r, d, s) {
  const n = r.u32(s.rva);
  for (let i = 0; i < n; i++) {
    const o = s.rva + 4 + i * 12;
    if (!r.has(o, 12)) break;
    const name = r.mdString(r.u64n(o + 4));
    if (name) d.threadNames.set(r.u32(o), name);
  }
}

/** MiscInfoStream (15): MINIDUMP_MISC_INFO_1..5, versioned by SizeOfInfo + Flags1.
 *  +0 SizeOfInfo +4 Flags1 +8 ProcessId +12 ProcessCreateTime(unix) +16 UserTime(s) +20 KernelTime(s)
 *  _2: +24 ProcessorMaxMhz +28 CurrentMhz +32 MhzLimit +36 MaxIdleState +40 CurrentIdleState
 *  _3: +44 ProcessIntegrityLevel +48 ExecuteFlags +52 ProtectedProcess +56 TimeZoneId
 *      +60 TIME_ZONE_INFORMATION (Bias i32 @+0, StandardName WCHAR[32] @+4) (172 bytes)
 *  _4: +232 BuildString WCHAR[260]  +752 DbgBldStr WCHAR[40]
 *  Flags1: 0x1 ProcessId, 0x2 ProcessTimes, 0x4 ProcessorPower, 0x10 Integrity,
 *          0x20 ExecuteFlags, 0x40 TimeZone, 0x80 Protected, 0x100 BuildString */
function parseMisc(r, d, s) {
  const o = s.rva, size = r.u32(o), f = r.u32(o + 4), m = { flags: f };
  if (f & 0x1) m.pid = r.u32(o + 8);
  if (f & 0x2) { m.processCreateTime = r.u32(o + 12); m.userTime = r.u32(o + 16); m.kernelTime = r.u32(o + 20); }
  if (size >= 44 && (f & 0x4)) { m.maxMhz = r.u32(o + 24); m.curMhz = r.u32(o + 28); }
  if (size >= 232) {
    if (f & 0x10) m.integrity = r.u32(o + 44);
    if (f & 0x40) { m.tzBias = r.i32(o + 60); m.tzName = r.utf16(o + 64, 64); }
  }
  if (size >= 832 && (f & 0x100)) { m.buildString = r.utf16(o + 232, 520); m.dbgBuildString = r.utf16(o + 752, 80); }
  d.misc = m;
}

/** ExceptionStream (6): MINIDUMP_EXCEPTION_STREAM
 *  +0 u32 ThreadId +4 u32 align
 *  +8 MINIDUMP_EXCEPTION: +8 u32 Code +12 u32 Flags +16 u64 Record +24 u64 Address
 *     +32 u32 NumberParameters +36 u32 align +40 u64 ExceptionInformation[15]
 *  +160 ThreadContext {u32 DataSize, u32 Rva} — CPU state AT the fault (more useful
 *  than the thread list context, which shows the dump writer's own frames). */
function parseException(r, d, s) {
  const o = s.rva, np = Math.min(r.u32(o + 32), 15), params = [];
  for (let i = 0; i < np; i++) params.push(r.u64(o + 40 + i * 8));
  const ex = {
    threadId: r.u32(o), code: r.u32(o + 8), flags: r.u32(o + 12), record: r.u64(o + 16),
    address: r.u64(o + 24), params, ctxSize: r.u32(o + 160), ctxRva: r.u32(o + 164)
  };
  try { ex.ctx = parseContext(r, ex.ctxRva, ex.ctxSize, d.system ? d.system.archId : 9); } catch (e) { ex.ctx = null; }
  d.exception = ex;
}

/** ProcessVmCountersStream (22). Two layouts (pack 4), selected by Revision:
 *  _1 (Revision 1): +0 u16 Revision +2 u32 PageFaultCount(@+4) +8 u64 PeakWorkingSetSize
 *     +16 WorkingSetSize +24 QuotaPeakPagedPool +32 QuotaPagedPool +40 QuotaPeakNonPagedPool
 *     +48 QuotaNonPagedPool +56 PagefileUsage +64 PeakPagefileUsage +72 PrivateUsage
 *  _2 (Revision 2): +0 u16 Revision +2 u16 Flags +4 PageFaultCount, same fields up to
 *     +64 PeakPagefileUsage, then +72 PeakVirtualSize +80 VirtualSize +88 PrivateUsage
 *     +96 PrivateWorkingSetSize +104 SharedCommitUsage +112.. Job* counters.
 *  (Verified on Cubase dumps: _2 PrivateUsage == PagefileUsage, as Windows reports.)
 *  All sizes in bytes. */
function parseProcessVm(r, d, s) {
  if (s.size < 80) return;
  const o = s.rva, rev = r.u16(o);
  d.vm = { revision: rev, pageFaults: r.u32(o + 4), peakWorkingSet: r.u64n(o + 8), workingSet: r.u64n(o + 16),
           pagefileUsage: r.u64n(o + 56), peakPagefileUsage: r.u64n(o + 64) };
  if (rev >= 2 && s.size >= 104) {
    d.vm.peakVirtual = r.u64n(o + 72); d.vm.virtual = r.u64n(o + 80);
    d.vm.privateUsage = r.u64n(o + 88); d.vm.privateWorkingSet = r.u64n(o + 96);
  } else d.vm.privateUsage = r.u64n(o + 72);
}

/** SystemMemoryInfoStream (21): MINIDUMP_SYSTEM_MEMORY_INFO_1 (pack 4)
 *  +0 u16 Revision +2 u16 Flags
 *  +4  BasicInfo:   +4 TimerResolution +8 PageSize +12 NumberOfPhysicalPages +16 Lowest +20 Highest
 *                   +24 AllocationGranularity +28 u64 MinUserAddr +36 u64 MaxUserAddr +44 u64 Affinity
 *                   +52 NumberOfProcessors
 *  +56 FileCacheInfo: +56 u64 CurrentSize +64 u64 PeakSize +72 u32 PageFaultCount +76 u64 MinWS +84 u64 MaxWS
 *                   +92 u64 CurrentSizeInclTransition +100 u64 PeakSizeInclTransition +108 u32 Repurpose +112 u32 Flags
 *  +116 BasicPerfInfo: +116 u64 AvailablePages +124 u64 CommittedPages +132 u64 CommitLimit +140 u64 PeakCommitment
 *  (pages; multiply by PageSize). PerfInfo (detailed counters) follows and is not used. */
function parseSysMem(r, d, s) {
  if (s.size < 148) return;
  const o = s.rva, ps = r.u32(o + 8) || 4096;
  d.sysmem = { revision: r.u16(o), pageSize: ps, ramTotal: r.u32(o + 12) * ps, fileCache: r.u64n(o + 56),
               ramAvail: r.u64n(o + 116) * ps, commit: r.u64n(o + 124) * ps, commitLimit: r.u64n(o + 132) * ps,
               commitPeak: r.u64n(o + 140) * ps };
}

/** CommentStreamA (10) / CommentStreamW (11): free text written by the dump producer. */
function parseCommentA(r, d, s) { d.comments.push(r.cstr(s.rva, s.size)); }
function parseCommentW(r, d, s) { d.comments.push(r.utf16(s.rva, s.size)); }

/* ----------------------------------------------------------------------------
 * 5. parseMinidump(buffer, fileName) -> dump object `d`
 *    MINIDUMP_HEADER (32 bytes):
 *      +0 u32 Signature 'MDMP' +4 u32 Version (low 16 = MINIDUMP_VERSION, high 16 = impl)
 *      +8 u32 NumberOfStreams +12 u32 StreamDirectoryRva +16 u32 CheckSum
 *      +20 u32 TimeDateStamp (unix) +24 u64 Flags (MINIDUMP_TYPE)
 *    MINIDUMP_DIRECTORY (12 bytes each): u32 StreamType, u32 DataSize, u32 Rva
 * ------------------------------------------------------------------------- */
function parseMinidump(buffer, fileName) {
  const r = new Reader(buffer);
  const d = {
    fileName: fileName || 'dump.dmp', fileSize: r.len, reader: r, warnings: [], streams: [],
    modules: [], unloaded: [], threads: [], memory: [], comments: [],
    threadNames: new Map(), threadInfo: new Map(), system: null, misc: null, exception: null, header: null,
    vm: null, sysmem: null
  };
  if (r.len < 32 || r.u32(0) !== MDMP_SIGNATURE) { const e = new Error('NOT_MINIDUMP'); e.code = 'NOT_MINIDUMP'; throw e; }
  const ver = r.u32(4);
  d.header = { version: ver & 0xFFFF, implVersion: ver >>> 16, numberOfStreams: r.u32(8), dirRva: r.u32(12),
               checksum: r.u32(16), timestamp: r.u32(20), flags: r.u64(24) };
  d.header.flagNames = DUMP_FLAGS.filter(([b]) => (d.header.flags & BigInt(b)) !== 0n).map(([, n]) => n);
  for (let i = 0; i < d.header.numberOfStreams; i++) {
    const o = d.header.dirRva + i * 12;
    if (!r.has(o, 12)) { d.warnings.push('Stream directory truncated'); break; }
    const type = r.u32(o), size = r.u32(o + 4), rva = r.u32(o + 8);
    if (type === 0) continue; // UnusedStream padding
    d.streams.push({ type, size, rva, name: STREAM_NAMES[type] || ('0x' + type.toString(16).toUpperCase()) });
  }
  // Dispatch order matters: SystemInfo first (CPU architecture decides the CONTEXT
  // layout), modules before threads, memory lists before thread stacks are appended.
  const handlers = { 7: parseSystemInfo, 4: parseModules, 14: parseUnloaded, 5: parseMemList, 9: parseMem64,
                     3: parseThreads, 17: parseThreadInfo, 24: parseThreadNames, 15: parseMisc,
                     6: parseException, 10: parseCommentA, 11: parseCommentW, 21: parseSysMem, 22: parseProcessVm };
  for (const type of [7, 4, 14, 5, 9, 3, 17, 24, 15, 6, 10, 11, 21, 22]) {
    for (const s of d.streams) {
      if (s.type !== type) continue;
      try { handlers[type](r, d, s); }
      catch (e) { d.warnings.push(`${s.name}: ${e.message}`); }
    }
  }
  // The first module in the list is the process executable (dbghelp convention).
  d.exeModule = d.modules[0] || null;
  const cmpBig = (a, b) => (a < b ? -1 : a > b ? 1 : 0);
  d.modules.sort((a, b) => cmpBig(a.base, b.base));
  d.memory.sort((a, b) => cmpBig(a.start, b.start));
  // memMaxEnd[i] = highest end address among ranges 0..i. Lets readMem() stop walking
  // backwards as soon as no earlier range can reach the requested address.
  d.memMaxEnd = [];
  let mx = 0n;
  for (const m of d.memory) { const e = m.start + BigInt(m.size); if (e > mx) mx = e; d.memMaxEnd.push(mx); }
  for (const th of d.threads) { th.name = d.threadNames.get(th.id) || ''; th.info = d.threadInfo.get(th.id) || null; }
  for (const m of d.modules) { m.kind = classifyModule(d, m); m.vendor = vendorOf(m.path); }
  return d;
}

/* ----------------------------------------------------------------------------
 * 6. ADDRESS HELPERS
 * ------------------------------------------------------------------------- */

/** Module containing `addr` (BigInt) — binary search over modules sorted by base. */
function findModule(d, addr) {
  if (typeof addr !== 'bigint') return null;
  let lo = 0, hi = d.modules.length - 1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1, m = d.modules[mid];
    if (addr < m.base) hi = mid - 1;
    else if (addr >= m.end) lo = mid + 1;
    else return m;
  }
  return null;
}
/** Unloaded module containing `addr` (linear; list is short). */
function findUnloaded(d, addr) {
  for (const u of d.unloaded) if (addr >= u.base && addr < u.end) return u;
  return null;
}
/** Read `len` bytes of process memory at virtual address `addr` (BigInt) if the dump
 *  captured them. Returns Uint8Array or null.
 *  Ranges may overlap: a thread stack appears in ThreadList AND in MemoryList, and
 *  dumps "WithIndirectlyReferencedMemory" add many small ranges that fall INSIDE a
 *  stack. So after the binary search (rightmost range starting <= addr) we walk
 *  backwards over every earlier range until one fully contains [addr, addr+len). */
function readMem(d, addr, len) {
  const mem = d.memory; if (!mem.length || len <= 0) return null;
  let lo = 0, hi = mem.length - 1, idx = -1;
  while (lo <= hi) { const mid = (lo + hi) >> 1; if (mem[mid].start <= addr) { idx = mid; lo = mid + 1; } else hi = mid - 1; }
  const want = addr + BigInt(len);
  for (let i = idx; i >= 0; i--) {
    if (d.memMaxEnd && d.memMaxEnd[i] < want) break; // nothing earlier can contain the range
    const m = mem[i], off = addr - m.start;
    if (off >= 0n && off + BigInt(len) <= BigInt(m.size)) {
      const fo = m.rva + Number(off);
      return d.reader.has(fo, len) ? d.reader.bytes(fo, len) : null;
    }
  }
  return null;
}
/** Address -> { text: 'module.dll+0x1234', module, offset } (or plain hex). */
function symbolize(d, addr, width) {
  const m = findModule(d, addr);
  if (m) {
    const off = addr - m.base;
    let text = `${m.name}+0x${off.toString(16).toUpperCase()}`;
    if (m.pe) { const fn = peFunctionName(m.pe, Number(off)); if (fn) text += `  (${fn})`; }
    return { text, module: m, offset: off };
  }
  const u = findUnloaded(d, addr);
  if (u) return { text: `<unloaded ${u.name}>+0x${(addr - u.base).toString(16).toUpperCase()}`, module: null, unloaded: u, offset: addr - u.base };
  return { text: hex(addr, width), module: null };
}

/* ----------------------------------------------------------------------------
 * 7. MODULE CLASSIFICATION
 *    kind ∈ host | host-component | vendor-component | plugin-vst3 | plugin-vst2 |
 *           plugin-clap | plugin-aax | audio-driver | gpu | ara | protection |
 *           webview | runtime | system | thirdparty
 *    The order of the tests matters (e.g. a .vst3 inside a Steinberg folder is
 *    still a plugin; a GPU driver lives under \Windows but is not "Windows").
 * ------------------------------------------------------------------------- */
function classifyModule(d, m) {
  const p = m.path.toLowerCase().replace(/\//g, '\\'), n = m.name.toLowerCase();
  if (d.exeModule && m.path === d.exeModule.path) return 'host';
  if (GPU_RE.test(n) || p.includes('\\driverstore\\filerepository\\')) return 'gpu';
  if (p.includes('\\windows\\')) return 'system';
  if (/edgewebview|webview2|embeddedbrowserwebview/.test(p)) return 'webview';
  if (/\\pace\\|\\ilok|wrappersist|paceeden/.test(p)) return 'protection';
  if (/\.vst3$|\.vst3\\/.test(p)) return 'plugin-vst3';
  if (/\.clap$/.test(p)) return 'plugin-clap';
  if (/\.aaxplugin/.test(p)) return 'plugin-aax';
  if (/asio|tusbaudio|ysusb/.test(n) || /\\[^\\]*asio[^\\]*\\/.test(p)) return 'audio-driver';
  if (/\\(vstplugins|vst plugins|vst2|vst|vst64|steinberg\\vstplugins)\\/.test(p)) return 'plugin-vst2';
  if (/\\celemony\\/.test(p)) return 'ara';
  if (/^(vcruntime|msvcp|concrt|vcomp|ucrtbase|api-ms-win|vccorlib)/.test(n)) return 'runtime';
  if (d.exeModule) {
    const exeDir = d.exeModule.path.toLowerCase().replace(/[^\\/]+$/, '');
    if (exeDir && p.startsWith(exeDir)) return 'host-component';
    // Vendor folder = first folder after "Program Files[ (x86)]\" in the exe path, e.g. "steinberg".
    const mv = /\\program files(?: \(x86\))?\\([^\\]+)\\/.exec(d.exeModule.path.toLowerCase());
    if (mv && (p.includes(`\\${mv[1]}\\`))) return 'vendor-component';
  }
  return 'thirdparty';
}
/** Vendor name from VENDOR_RULES, or '' when unknown. */
function vendorOf(path) {
  const p = (path || '').toLowerCase();
  for (const [re, name] of VENDOR_RULES) if (re.test(p)) return name;
  return '';
}
/** Windows + C runtime: code that is almost never the root cause by itself. */
function isSystemish(m) { return !m || m.kind === 'system' || m.kind === 'runtime'; }
/** Priority tiers used to pick a culprit from a stack (1 = most suspicious). */
function tierOf(m) {
  if (!m) return 9;
  switch (m.kind) {
    case 'plugin-vst3': case 'plugin-vst2': case 'plugin-clap': case 'plugin-aax':
    case 'audio-driver': case 'ara': case 'protection': case 'thirdparty': return 1;
    case 'vendor-component': case 'webview': case 'gpu': return 2;
    case 'host-component': case 'host': return 3;
    default: return 9;
  }
}

/* ----------------------------------------------------------------------------
 * 8. HEURISTIC STACK SCAN
 *    Without symbols/unwind data we cannot walk frames exactly. Instead every
 *    pointer-sized slot from the stack pointer upwards is read, and values that
 *    point inside a loaded module (past its PE header) are reported as possible
 *    return addresses. When the dump includes the code bytes before such an
 *    address, we verify that they encode a CALL instruction (x86/x64 only):
 *      E8 rel32 (5 bytes) | FF /2 with ModRM (2,3,6,7 bytes, optional REX).
 * ------------------------------------------------------------------------- */
/** Code bytes at a virtual address: from the dump if captured, otherwise from the
 *  module file the user loaded (m.pe), translating address -> RVA -> file offset. */
function readCode(d, addr, len) {
  const b = readMem(d, addr, len);
  if (b) return b;
  const m = findModule(d, addr);
  return m && m.pe ? peRead(m.pe, Number(addr - m.base), len) : null;
}
function isAfterCall(d, ret) {
  if (ret < 8n) return null;
  const b = readCode(d, ret - 7n, 7);
  if (!b) return null; // code not captured
  if (b[2] === 0xE8) return true;                                   // call rel32
  const ff = (i) => b[i] === 0xFF && ((b[i + 1] >> 3) & 7) === 2;   // call r/m
  return ff(5) || ff(4) || ff(1) || ff(0);
}
/** Scan stack memory [from, end) for values pointing into modules. */
function scanRange(d, from, end, ps, maxFrames, frames) {
  const len = Number(end - from);
  if (len <= 0) return frames;
  const bytes = readMem(d, from, len);
  if (!bytes) return frames;
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  let last = frames.length ? frames[frames.length - 1].sym : '';
  for (let off = 0; off + ps <= bytes.length && frames.length < maxFrames; off += ps) {
    const v = ps === 8 ? dv.getBigUint64(off, true) : BigInt(dv.getUint32(off, true));
    const m = findModule(d, v);
    if (!m) continue;
    if (v - m.base < 0x1000n) continue; // PE headers, not code
    const sym = symbolize(d, v).text;
    if (sym === last) continue;
    last = sym;
    frames.push({ where: 'stack', method: 'scan', stackAddr: from + BigInt(off), addr: v, sym, module: m, call: isAfterCall(d, v) });
  }
  return frames;
}
/** Frames of a thread. x64 with at least one loaded module file: exact unwind first
 *  (unwindX64), then heuristic scan from where the unwinder stopped. Otherwise: scan only. */
function scanStack(d, thread, ctx, maxFrames) {
  maxFrames = maxFrames || 64;
  let frames = [];
  if (!thread) return frames;
  ctx = ctx || thread.ctx;
  const ps = ctx ? ctx.ptrSize : (d.system && d.system.archId === 0 ? 4 : 8);
  const start = thread.stackStart, end = thread.stackStart + BigInt(thread.stackSize);
  let from = (ctx && ctx.sp >= start && ctx.sp < end) ? ctx.sp : start;
  let unwound = false;
  if (ctx && ctx.arch === 'x64' && d.hasPE) {
    try {
      const u = unwindX64(d, thread, ctx, maxFrames);
      if (u.frames.length > 1) { frames = u.frames; unwound = true; if (u.rsp > from && u.rsp < end) from = u.rsp; }
    } catch (e) { d.warnings.push('unwind: ' + e.message); frames = []; }
  }
  if (!unwound && ctx && ctx.ip) {
    const s = symbolize(d, ctx.ip);
    frames.push({ where: 'ip', method: 'scan', stackAddr: null, addr: ctx.ip, sym: s.text, module: s.module, unloaded: s.unloaded || null, call: true });
  }
  const nExact = frames.length;
  scanRange(d, from, end, ps, maxFrames, frames);
  // If code bytes verify some scanned frames as return addresses, drop the scanned ones proven NOT to be.
  const scanned = frames.slice(nExact);
  if (scanned.some(f => f.call === true)) frames = frames.slice(0, nExact).concat(scanned.filter(f => f.call !== false));
  return frames;
}

/* ----------------------------------------------------------------------------
 * 8b. PE READER + EXACT x64 UNWINDER
 *     The user may drop the module files (.dll/.vst3/.exe) next to the dumps.
 *     A file matches a dump module when IMAGE_FILE_HEADER.TimeDateStamp and
 *     IMAGE_OPTIONAL_HEADER.SizeOfImage are identical (same build).
 *     From the file we read:
 *       - section table  -> RVA to file offset translation, code bytes
 *       - export table   -> nearest exported name for an address
 *       - .pdata         -> RUNTIME_FUNCTION {Begin, End, UnwindInfo} (x64)
 *       - UNWIND_INFO    -> how to undo the function prologue = exact unwinding
 *     Layouts (winnt.h):
 *       IMAGE_DOS_HEADER: e_magic 'MZ' @0, e_lfanew @0x3C
 *       'PE\0\0' @e_lfanew, IMAGE_FILE_HEADER @+4 (20 bytes):
 *         Machine u16 @+0, NumberOfSections @+2, TimeDateStamp @+4, SizeOfOptionalHeader @+16
 *       IMAGE_OPTIONAL_HEADER @+24: Magic 0x10B (PE32) / 0x20B (PE32+), SizeOfImage @+56,
 *         DataDirectory @+96 (PE32) / @+112 (PE32+): [0] export, [3] exception (.pdata)
 *       IMAGE_SECTION_HEADER (40): Name[8], VirtualSize @8, VirtualAddress @12,
 *         SizeOfRawData @16, PointerToRawData @20
 *       IMAGE_EXPORT_DIRECTORY: NumberOfFunctions @20, NumberOfNames @24,
 *         AddressOfFunctions @28, AddressOfNames @32, AddressOfNameOrdinals @36
 *       RUNTIME_FUNCTION (12): BeginAddress, EndAddress, UnwindInfoAddress (RVAs)
 *       UNWIND_INFO: u8 Version:3|Flags:5, u8 SizeOfProlog, u8 CountOfCodes,

/* ----------------------------------------------------------------------------
 * 9. ANALYZE — turns the parsed dump into a diagnosis (language-neutral).
 *    Output fields: kind, verdict{key,vars}, culprit{module,reason,confidence},
 *    findings[{key,vars}], actions[{key,vars}], frames, suspects, thirdParty...

/** Main (UI) thread:
 *  1) with ThreadInfoList: thread whose start address is inside the .exe (its entry

 *     thread). Case 2 is a heuristic. */

  if (a.uptimeSec !== undefined) F('f.uptime', { dur: fmtDur(a.uptimeSec) });
  if (d.misc && d.misc.integrity >= 0x3000 && d.misc.integrity < 0x4000) F('f.elevated');
  F('f.third', { n: a.thirdParty.length });
  const nUnw = a.frames.filter(f => f.method === 'unwind').length;
  if (nUnw > 1) F('f.unwound', { n: nUnw }); else if (a.frames.length) F('f.heuristic');

  // Actions
  const cm = a.culprit.module;
  if (a.culprit.reason === 'unloaded') a.actions.push({ key: 'a.unloaded', vars: {} });
  else a.actions.push(...actionsFor(cm, a.hostLabel));
  if (a.exc && a.exc.code === 0xC0000006) a.actions.push({ key: 'a.inpage', vars: {} });
  // Freeze: one "report it" action only (deadlock-specific when detected, else a.hang).
  if (a.kind !== 'crash') a.actions = a.actions.filter(x => x.key !== 'a.report' && x.key !== 'a.reportDev');
  if (a.deadlock) a.actions.push({ key: 'a.deadlock', vars: { module: cm.name } });
  else if (a.kind !== 'crash' && cm) a.actions.push({ key: 'a.hang', vars: { module: cm.name } });
  if (a.mem && a.mem.lowRam) a.actions.push({ key: 'a.mem.ram', vars: {} });
  if (a.mem && a.mem.highCommit) a.actions.push({ key: 'a.mem.commit', vars: {} });
  if (a.warnings.some(w => w.key === 'w.dual')) a.actions.push({ key: 'a.dual', vars: {} });
  if (a.culprit.reason === 'fault-system' || a.culprit.reason === 'none') a.actions.push({ key: 'a.system', vars: {} });
  a.actions.push({ key: 'a.windbg', vars: {} });
  a.signature = crashSignature(d, a);
  return a;
}

/** Activities (keys of ACTIVITY_RULES) seen in the top 30 frames, in stack order.
 *  An audio/processing thread always starts with 'audioproc'. */
function inferActivity(frames, role) {
  const out = role === 'audio' ? ['audioproc'] : [];
  for (const f of frames.slice(0, 30)) {
    if (!f.module) continue;
    const n = f.module.name.toLowerCase();
    for (const rule of ACTIVITY_RULES) {
      if ((rule.name && rule.name.test(n)) || (rule.kinds && rule.kinds.includes(f.module.kind))) {
        if (!out.includes(rule.act)) out.push(rule.act);

      }

  return out;
}

/** Warnings: same plugin as VST2 + VST3, plugin binaries older than OLD_PLUGIN_YEARS
 *  (PE link time; ignored when outside 2000..dump time, as reproducible builds store a
 *  hash there), and plugins the vendor lists as legacy. */
function moduleWarnings(d, a) {
  const W = [], dumpT = d.header.timestamp;
  const plugins = d.modules.filter(m => /^plugin-/.test(m.kind));
  const norm = (n) => n.toLowerCase().replace(/\.(dll|vst3)$/, '').replace(/\(x64\)|x64|64bit|[\s_\-]+/g, '');
  const v2 = new Map(), v3 = new Map();
  for (const m of plugins) { if (m.kind === 'plugin-vst2') v2.set(norm(m.name), m); if (m.kind === 'plugin-vst3') v3.set(norm(m.name), m); }
  for (const [k, m2] of v2) if (v3.has(k)) { const m3 = v3.get(k); W.push({ key: 'w.dual', module: m3, vars: { name: m3.name.replace(/\.vst3$/i, ''), v2: m2.name, v3: m3.name } }); }
  for (const m of plugins) {
    if (m.timestamp < 946684800 || m.timestamp >= dumpT) continue;
    const age = (dumpT - m.timestamp) / 31557600;
    if (age >= OLD_PLUGIN_YEARS) W.push({ key: 'w.old', module: m, vars: { module: m.name, year: new Date(m.timestamp * 1000).getUTCFullYear(), age: Math.floor(age), host: a.host ? a.host.base : 'host' } });
  }

  for (const m of d.modules) for (const L of LEGACY_PLUGINS) {
    if (L.re.test(m.path.toLowerCase()) && !done.has(L.key)) { done.add(L.key); W.push({ key: 'w.legacy', module: m, vars: { module: m.name, note: '@legacy.' + L.key } }); }
  }
  return W;
}

/** Per-thread state from its instruction pointer + first non-Windows module on its stack.
 *  state: wait (IP inside ntdll/win32u = in a system call) | third | host | sys | unknown. */
function overviewThreads(d, a) {
  const res = { total: d.threads.length, wait: 0, third: [], host: 0, sys: 0, rows: new Map() };
  const cul = a.culprit.module;
  for (const th of d.threads) {
    const isFault = a.faultThread && th.id === a.faultThread.id;
    const ctx = isFault ? (a.faultCtx || th.ctx) : th.ctx;
    const frames = isFault ? a.frames : scanStack(d, th, ctx, 32);
    const ipm = ctx ? findModule(d, ctx.ip) : null;
    let state = 'unknown';
    if (ipm) state = WAIT_IP_RE.test(ipm.name.toLowerCase()) ? 'wait' : isSystemish(ipm) ? 'sys'
                   : (ipm.kind === 'host' || ipm.kind === 'host-component') ? 'host' : 'third';
    const topF = frames.find(f => f.module && !isSystemish(f.module));
    res.rows.set(th.id, { state, top: topF ? topF.module : null, hasCulprit: !!cul && frames.some(f => f.module === cul) });
    if (state === 'wait') res.wait++; else if (state === 'third') res.third.push(th); else if (state === 'host') res.host++; else if (state === 'sys') res.sys++;
  }

}


/* ----------------------------------------------------------------------------
 * 9b. CRASH SIGNATURE, C++ EXCEPTION TYPE, "FIX FIRST" RANKING   (1.4.0)

/** FNV-1a 32-bit hash of a string (UTF-16 code units) -> 8 hex digits. */

/** Crash signature: kind | exception code | culprit module + version | code location.

/** Undecorate an MSVC RTTI type name: ".?AVbad_alloc@std@@" -> "std::bad_alloc".
 *  .?AV = class, .?AU = struct, .?AW4 = enum. Templates (?$) are returned trimmed but raw. */

/** C++ exception (0xE06D7363) thrown type, read through the MSVC ThrowInfo structures:
 *    ExceptionInformation[2] = ThrowInfo*, [3] = image base of the thrower (x64).
 *    ThrowInfo:          +0 attributes, +4 pmfnUnwind, +8 pForwardCompat, +12 pCatchableTypeArray
 *    CatchableTypeArray: +0 int count, +4 CatchableType*[count]
 *    CatchableType:      +0 properties, +4 pType (TypeDescriptor*)
 *    TypeDescriptor:     +0 pVFTable, +ptr spare, +2*ptr char name[]   (".?AV...@@")
 *  On x64 every "pointer" inside these structures is an RVA relative to [3]; on x86 they

 *  Returns { type, bases[] } or null when the memory is not available. */
function cxxExceptionType(d, a) {

  const x64 = a.ptrWidth === 16, base = x64 && ex.params.length >= 4 ? ex.params[3] : 0n;

  const str = (addr) => {

  const n = r32(at(cta)); if (n === null || n < 1 || n > 64) return null;

  for (let i = 0; i < Math.min(n, 8); i++) {
    const ct = r32(at(cta) + 4n + BigInt(i * 4)); if (ct === null) break;
    const td = r32(at(ct) + 4n); if (td === null) break;
    const raw = str(at(td) + (x64 ? 16n : 8n)); if (!raw) break;
    types.push(demangleTypeName(raw));
  }
  return types.length ? { type: types[0], bases: types.slice(1) } : null;
}
/** Short explanation for well-known standard exception types (key 'cxx.<name>'). */
const CXX_HINTS = ['bad_alloc', 'bad_array_new_length', 'length_error', 'out_of_range', 'invalid_argument', 'runtime_error',
                   'system_error', 'bad_function_call', 'bad_cast', 'logic_error', 'overflow_error', 'range_error'];

/** "Fix first": ranks culprit modules across dumps.
 *  score = 10 x crashes + 5 if the last one is <= 90 days before the newest dump
 *          + 2 if confidence was high - 8 if a later version stopped crashing (updatedOk).
 *  Order: modules that are NOT probably-solved first, then score, then recency.
 *  Suggested action by module kind / warnings: update, replace (old or legacy), driver,
 *  gpu, host, system, or "verify" when an update probably solved it. */
function fixFirst(ok, rows, notes) {
  const newest = rows.length ? rows[rows.length - 1].time : 0;
  const solved = new Set(notes.filter(n => n.key === 'c.updatedOk').map(n => n.vars.module));
  const warned = new Set();
  for (const { a } of ok) for (const w of a.warnings || []) if ((w.key === 'w.old' || w.key === 'w.legacy') && w.module) warned.add(w.module.name);
  const by = new Map();
  for (const r of rows) {
    if (!r.culprit) continue;
    const e = by.get(r.culprit) || { module: r.culprit, kind: r.culpritKind, count: 0, last: 0, high: false, versions: new Set() };
    e.count++; e.last = Math.max(e.last, r.time); e.high = e.high || r.confidence === 'high'; if (r.culpritVer) e.versions.add(r.culpritVer);
    by.set(r.culprit, e);
  }
  const out = [...by.values()].map(e => {
    const recent = newest - e.last <= 90 * 86400;
    const isSolved = solved.has(e.module);
    let action = 'fix.update';
    if (isSolved) action = 'fix.verify';
    else if (warned.has(e.module)) action = 'fix.replace';
    else if (e.kind === 'audio-driver') action = 'fix.driver';
    else if (e.kind === 'gpu') action = 'fix.gpu';
    else if (e.kind === 'host' || e.kind === 'host-component' || e.kind === 'vendor-component') action = 'fix.host';
    else if (e.kind === 'system' || e.kind === 'runtime') action = 'fix.system';
    const score = e.count * 10 + (recent ? 5 : 0) + (e.high ? 2 : 0) - (isSolved ? 8 : 0);
    return { module: e.module, kind: e.kind, count: e.count, last: e.last, versions: [...e.versions], solved: isSolved, action, score };
  });

  return out.sort((x, y) => (x.solved - y.solved) || (y.score - x.score) || (y.last - x.last));
}

/* ----------------------------------------------------------------------------
 * 10. COMPARE — statistics across several analysed dumps.
 *     items: [{ d, a }]  ->  { rows, freq:[[name,count,kind]], common:[[name,count]], notes }
 * ------------------------------------------------------------------------- */
function compare(items) {
  const ok = items.filter(it => it.d && it.a).slice().sort((x, y) => x.d.header.timestamp - y.d.header.timestamp);
  const rows = ok.map(({ d, a }) => ({
    file: d.fileName, time: d.header.timestamp, host: a.hostLabel, hostVer: a.host ? a.host.version : '', kind: a.kind,
    code: a.exc ? a.exc.codeHex : '', codeName: a.exc ? a.exc.name : '',
    culprit: a.culprit.module ? a.culprit.module.name : '', culpritKind: a.culprit.module ? a.culprit.module.kind : '',
    culpritVer: a.culprit.module ? (a.culprit.module.fileVersion || '') : '', confidence: a.culprit.confidence, reason: a.culprit.reason,
    sig: a.signature ? a.signature.id : ''
  }));
  const freqMap = new Map();
  for (const r of rows) if (r.culprit) {
    const e = freqMap.get(r.culprit) || [r.culprit, 0, r.culpritKind];
    e[1]++; freqMap.set(r.culprit, e);
  }
  const freq = [...freqMap.values()].sort((x, y) => y[1] - x[1]);
  const presence = new Map();
  for (const { a } of ok) for (const n of new Set(a.thirdParty.map(m => m.name))) presence.set(n, (presence.get(n) || 0) + 1);
  const common = [...presence.entries()].filter(([, c]) => c >= 2).sort((x, y) => y[1] - x[1]);

  // Version history of every culprit module: in which dumps it was loaded, with which
  // file version, and whether it was the culprit there.
  const versions = freq.map(([name]) => ({
    name,
    events: ok.map(({ d }, i) => {
      const m = d.modules.find(x => x.name === name);
      return m ? { time: d.header.timestamp, ver: m.fileVersion || '?', culprit: rows[i].culprit === name, file: d.fileName } : null;
    }).filter(Boolean)
  }));

  // Module changes between consecutive dumps: third-party modules (plugins, drivers, vendor
  // components) seen for the first time, or whose file version differs from the last dump
  // where they were loaded. The first dump is the baseline.
  const changes = [], lastVer = new Map();
  ok.forEach(({ d, a }, i) => {
    const firstSeen = [], updated = [];
    for (const m of a.thirdParty) {
      const v = m.fileVersion || '?';
      if (!lastVer.has(m.name)) { if (i) firstSeen.push(m.name); }
      else if (lastVer.get(m.name) !== v) updated.push({ name: m.name, from: lastVer.get(m.name), to: v });
      lastVer.set(m.name, v);
    }
    changes.push({ time: d.header.timestamp, file: d.fileName, baseline: i === 0, firstSeen, updated });
  });

  const notes = [];
  if (rows.length < 2) notes.push({ key: 'c.single', vars: {} });
  else {
    for (const [name, n] of freq) if (n >= 2) notes.push({ key: 'c.repeat', vars: { module: name, n, total: rows.length } });
    if (freq.length === rows.filter(r => r.culprit).length && freq.length >= 2) notes.push({ key: 'c.allDifferent', vars: {} });
    const sys = rows.filter(r => r.reason === 'fault-system' || r.reason === 'none').length;
    if (sys >= 2) notes.push({ key: 'c.systemMany', vars: { n: sys } });
    for (const v of versions) {
      const crashes = v.events.filter(e => e.culprit);
      if (!crashes.length) continue;
      const cv = [...new Set(crashes.map(e => e.ver))];
      if (crashes.length >= 2 && cv.length >= 2) notes.push({ key: 'c.updatedStill', vars: { module: v.name, versions: cv.join(' → ') } });
      else if (crashes.length >= 2) notes.push({ key: 'c.sameVersion', vars: { module: v.name, n: crashes.length, ver: cv[0] } });
      const last = crashes[crashes.length - 1], later = v.events.filter(e => e.time > last.time);
      if (later.length && later.every(e => !e.culprit) && later.some(e => e.ver !== last.ver))
        notes.push({ key: 'c.updatedOk', vars: { module: v.name, from: last.ver, to: later[later.length - 1].ver, n: later.length } });
    }
    // Warnings repeated in 2+ dumps (same warning key + same module).
    const wc = new Map();
    for (const { a } of ok) for (const w of a.warnings || []) {
      const k = w.key + '|' + (w.module ? w.module.name : '');
      const e = wc.get(k) || { w, n: 0 }; e.n++; wc.set(k, e);
    }
    for (const { w, n } of wc.values()) if (n >= 2) notes.push({ key: 'c.warnMany', vars: { n }, sub: { key: w.key, vars: w.vars } });
    rows.forEach((r, i) => {
      if (!i || !r.culprit) return;
      const ch = changes[i], date = fmtTime(r.time).slice(0, 10);
      const up = ch.updated.find(u => u.name === r.culprit);
      if (up) notes.push({ key: 'c.culpritUpdated', vars: { module: r.culprit, from: up.from, to: up.to, date } });
    });
  }
  // Signature groups: the same bug (same module, version and code location) in several dumps.
  const sigs = new Map();
  for (const r of rows) if (r.sig) { const e = sigs.get(r.sig) || { sig: r.sig, module: r.culprit, n: 0 }; e.n++; sigs.set(r.sig, e); }
  for (const e of sigs.values()) if (e.n >= 2) notes.unshift({ key: 'c.sameSig', vars: { sig: e.sig, module: e.module || '-', n: e.n } });
  const fix = fixFirst(ok, rows, notes);
  return { rows, freq, common, notes, versions, changes, fixFirst: fix };
}
/** Text of a comparison note (handles notes that embed another translated message). */
function noteText(lang, n) {

/* ----------------------------------------------------------------------------
 * 11. PLAIN-TEXT REPORTS (.txt export). CRLF line endings for Windows Notepad.

function buildTextReport(d, a, lang, notes) {

  L.push(S(T('h.what')));

  L.push(S(T('h.todo')));
  a.actions.forEach((x, i) => L.push(` ${i + 1}. ` + wrap(T(x.key, x.vars), 72, '    ')));
  const myNotes = notesForDump(notes, a);
  if (myNotes.length) {
    L.push(S(T('h.notes')));

    L.push(`${pad(T('l.ws') + ':', 34)}${z(M.ws)} (${z(M.peakWs)})`);
    L.push(`${pad(T('l.pagefile') + ':', 34)}${z(M.pagefile)}`);
    L.push(`${pad(T('l.ramTotal') + ':', 34)}${z(M.total)}`);
    L.push(`${pad(T('l.ramAvail') + ':', 34)}${z(M.avail)}${M.availPct !== undefined ? ` (${M.availPct}%)` : ''}`);
    L.push(`${pad(T('l.commit') + ':', 34)}${z(M.commit)} / ${z(M.commitLimit)}${M.commitPct !== undefined ? ` (${M.commitPct}%)` : ''}`);

    L.push(`${pad(T('l.address') + ':', 16)}${hex(ex.address, W)}  (${a.faultSym})`);
