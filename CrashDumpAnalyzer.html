  // Signature groups: the same bug (same module, version and code location) in several dumps.
  const sigs = new Map();
  for (const r of rows) if (r.sig) { const e = sigs.get(r.sig) || { sig: r.sig, module: r.culprit, n: 0 }; e.n++; sigs.set(r.sig, e); }
  for (const e of sigs.values()) if (e.n >= 2) notes.unshift({ key: 'c.sameSig', vars: { sig: e.sig, module: e.module || '-', n: e.n } });
  const fix = fixFirst(ok, rows, notes);

}

/** Export options (1.5.0): { hideMem: true } leaves every memory figure out of the exports

    }

    L.push(S(T('h.exception')));
    L.push(`${pad(T('l.code') + ':', 16)}${a.exc.codeHex} ${a.exc.name}`);
    L.push(`${pad(T('l.address') + ':', 16)}${hex(ex.address, W)}  (${a.faultSym})`);
    L.push(`${pad(T('l.thread') + ':', 16)}${ex.threadId}${a.faultThread && a.faultThread.name ? ' "' + a.faultThread.name + '"' : ''}`);
    L.push(`${pad(T('l.flags') + ':', 16)}${hex(ex.flags, 8)}`);
    ex.params.forEach((p, i) => L.push(`${pad('  [' + i + ']', 16)}${hex(p, W)}`));

function buildCompareText(items, lang) {
  const T = (k, v) => t(lang, k, v), c = compare(items), L = [];
  L.push(T('r.cmpTitle') + ` (${c.rows.length})`, '='.repeat(40), T('r.generated', { v: VERSION }), '');
  L.push(`${pad(T('l.time'), 20)} ${pad(T('l.host'), 22)} ${pad(T('l.kind'), 16)} ${pad(T('l.code'), 12)} ${pad(T('l.culprit'), 34)} ${T('l.confidence')}`);
  L.push('-'.repeat(118));
  for (const r of c.rows) L.push(`${pad(fmtTime(r.time), 20)} ${pad(r.host, 22)} ${pad(T('kind.' + r.kind), 16)} ${pad(r.code || '-', 12)} ${pad(r.culprit || '-', 34)} ${T('conf.' + r.confidence)}`);
  L.push(section(T('h.fixFirst')));
  c.fixFirst.forEach((f, i) => L.push(`  ${pad(i + 1 + '.', 4)}${pad(f.module, 34)} ${pad(f.count + 'x', 5)} ${pad(fmtTime(f.last).slice(0, 10), 12)} ${T(f.action)}`));
  L.push(section(T('l.signature')));
  for (const r of c.rows) L.push(`  ${pad(fmtTime(r.time), 20)} ${pad(r.sig || '-', 14)} ${r.culprit || '-'}`);
  L.push(section(T('h.freq')));
  for (const [n, k, kind] of c.freq) L.push(`  ${pad(k + 'x', 5)} ${pad(n, 40)} ${T('mk.' + kind)}`);
  if (c.common.length) { L.push(section(T('h.common'))); for (const [n, k] of c.common) L.push(`  ${pad(k + '/' + c.rows.length, 7)} ${n}`); }
  L.push(section(T('h.cmpNotes')));
  for (const n of c.notes) L.push(' - ' + wrap(noteText(lang, n), 74, '   '));
  L.push(section(T('h.changes')));
  L.push(wrap(T('l.changesNote'), 78, ''), '');
  for (const ch of c.changes) {
    if (ch.baseline) { L.push(`  ${fmtTime(ch.time)}  ${T('l.baseline')}`); continue; }
    if (!ch.firstSeen.length && !ch.updated.length) continue;
    L.push(`  ${fmtTime(ch.time)}`);
    for (const u of ch.updated) L.push(`     ~ ${pad(u.name, 40)} ${u.from} -> ${u.to}`);
    for (const n of ch.firstSeen) L.push(`     + ${n}`);
  }
  if (c.versions.length) {
    L.push(section(T('h.versions')));
    for (const v of c.versions) {
      L.push('  ' + v.name);
      for (const e of v.events) L.push(`     ${pad(fmtTime(e.time), 20)} ${pad(e.ver, 18)} ${e.culprit ? '<< ' + T('l.culpritHere') : ''}`);
    }
  }
  return L.join('\n').replace(/\r?\n/g, '\r\n') + '\r\n';
}

/* ----------------------------------------------------------------------------
 * SUPPORT SUMMARY — always English (vendors' support teams), compact, factual.
 * ------------------------------------------------------------------------- */
function buildSupportText(d, a, opts) {
  const T = (k, v) => t('en', k, v), W = a.ptrWidth, L = [], cm = a.culprit.module, mac = isMac(d);
  const row = (k, v) => L.push(`${pad(k, 13)}: ${v}`);
  L.push(T('s.intro', { v: VERSION }), '');
  row('Application', `${a.hostLabel}${d.system ? ' (' + d.system.arch + (mac && d.mac.translated ? ', Rosetta 2' : '') + ')' : ''}`);
  if (d.system && mac) { row('macOS', d.system.osName); if (d.mac.model) row('Mac model', d.mac.model); }
  else if (d.system) row('Windows', d.system.osName + (d.misc && d.misc.buildString ? '  ' + d.misc.buildString : ''));
  row('Dump time', fmtTime(a.dumpTime) + (a.uptimeSec !== undefined ? `  (uptime ${fmtDur(a.uptimeSec)})` : ''));
  row('Type', T('kind.' + a.kind));
  if (a.signature) row('Signature', `${a.signature.id}  (${a.signature.text})`);
  if (a.score && cm) row('Score', `${a.score.value}/100 (${T('conf.' + a.culprit.confidence)})`);
  if (a.cxxType) row('C++ type', a.cxxType.type);
  if (a.exc && mac) {
    row('Exception', `${a.exc.type}${a.exc.signal ? ' (' + a.exc.signal + ')' : ''}${a.exc.codes ? '  codes ' + a.exc.codes : ''}${a.exc.subtype ? '  ' + a.exc.subtype : ''}`);
    row('Fault at', a.faultSym);
    if (d.mac.termination && d.mac.termination.indicator) row('Termination', `${d.mac.termination.namespace || ''} ${d.mac.termination.indicator}`.trim());
    if (d.mac.asi) row('ASI', d.mac.asi.replace(/\s*\n\s*/g, ' | ').slice(0, 400));
  } else if (a.exc) {
    let x = `${a.exc.codeHex} ${a.exc.name}`;
    if (a.av) x += ` — ${['read', 'write'][a.av.op] || (a.av.op === 8 ? 'execute' : 'access')} at ${hex(a.av.target, W)} (${a.av.category})`;
    row('Exception', x);
    row('Fault at', a.faultSym);
    if (a.instr) {
      row('Instruction', `${a.instr.asm}   [${a.instr.bytes}]`);
      if (a.instr.regs.length) row('Registers', a.instr.regs.map(r => `${r.name}=${hex(r.value, W)}`).join(', '));
    }
  }
  if (cm) {
    row('Module', `${cm.name}  version ${cm.fileVersion || '?'}`);
    if (cm.timestamp) row('Link time', `${fmtTime(cm.timestamp)}  (0x${(cm.timestamp >>> 0).toString(16).toUpperCase()})`);
    if (cm.pdb) row('PDB', `${cm.pdb.split(/[\\/]/).pop()}  ${cm.pdbId}`);
    else if (mac && cm.pdbId) row('UUID', cm.pdbId);
  }
  if (a.faultThread) row('Thread', `${a.faultThread.id}${a.faultThread.name ? ' "' + a.faultThread.name + '"' : ''} (${T('role.' + (a.faultRole || 'worker'))})`);
  if (a.activity && a.activity.length) row('Activity', a.activity.map(k => T('act.' + k)).join(', '));
  if (a.mem && a.mem.total && !(opts && opts.hideMem)) row('Memory', `process private ${fmtSize(a.mem.priv || 0)}, RAM free ${fmtSize(a.mem.avail)} of ${fmtSize(a.mem.total)}, commit ${a.mem.commitPct}%`);
  L.push('', `Stack (${mac ? 'symbolicated by macOS' : a.frames.some(f => f.method === 'unwind') ? 'partly unwound with module files' : 'heuristic scan, no symbols'}):`);

}

/* ----------------------------------------------------------------------------
 * AI SECOND OPINION (1.6.0) — an English, self-contained prompt the user pastes into an
 * AI assistant. It bundles the support summary, the confidence evidence, the stacks of
 * EVERY thread (not only the crashed one), exception parameters / registers and the full
 * module list, and asks the model to confirm or challenge the diagnosis. The page itself
 * never contacts any service; the UI anonymises the text like every other export.
 * ------------------------------------------------------------------------- */
function buildAIPrompt(d, a, opts) {
  const T = (k, v) => t('en', k, v), W = a.ptrWidth, L = [], mac = isMac(d);
  L.push('You are an expert in post-mortem debugging of ' + (mac ? 'macOS crash reports' : 'Windows minidumps') + ' of audio applications (DAWs, VST/AU plugins, audio drivers).');
  L.push('Below is an AUTOMATED, symbol-less analysis produced offline by Crash Dump Analyzer ' + VERSION + '. The tool is heuristic: it can point to the wrong module.');
  L.push('Please: (1) confirm or challenge the suspected culprit using the stacks of ALL threads and the exception data; (2) explain the most likely mechanism in plain words;');
  L.push('(3) say what additional evidence would settle it (e.g. another dump, debug symbols, a test with the plugin removed); (4) do not invent function names: addresses are module+offset only.');
  L.push('Answer with: Verdict / Confidence (and why) / Mechanism / What to do next.', '', '=== AUTOMATED SUMMARY ===');
  L.push(buildSupportText(d, a, opts).replace(/\r\n/g, '\n').trim());
  if (a.score) {
    L.push('', '=== TOOL CONFIDENCE SCORE ===', `${a.score.value}/100`);
    for (const e of a.score.evidence) L.push(`  ${e.pts >= 0 ? '+' : ''}${e.pts}  ${T(e.key, e.vars)}`);
  }
  L.push('', '=== FINDINGS ===');
  for (const f of visibleFindings(a, opts)) L.push('- ' + T(f.key, f.vars));
  if (d.exception) {
    L.push('', '=== EXCEPTION ===');
    if (mac) { L.push(`type: ${d.exception.type} ${d.exception.signal || ''}  codes: ${d.exception.codes || '-'}  subtype: ${d.exception.subtype || '-'}`); if (d.mac.asi) L.push('ASI: ' + d.mac.asi.replace(/\n/g, ' | ')); if (d.mac.termination) L.push('termination: ' + JSON.stringify(d.mac.termination)); }
    else { L.push(`code: ${a.exc.codeHex} ${a.exc.name}  address: ${hex(d.exception.address, W)} (${a.faultSym})`); d.exception.params.forEach((pv, i) => L.push(`  ExceptionInformation[${i}] = ${hex(pv, W)}`)); }
    if (a.faultCtx && a.faultCtx.regs.length) L.push('registers: ' + a.faultCtx.regs.map(([n, v]) => `${n}=${hex(v, W)}`).join(' '));
  }
  L.push('', `=== THREADS (${d.threads.length}) — first frames of each, leaf first ===`);
  const ov = a.threadsOv;
  for (const th of d.threads) {
    const r = ov && ov.rows.get(th.id);
    const frames = a.faultThread && th.id === a.faultThread.id ? a.frames : scanStack(d, th, th.ctx, 16);
    const tag = (a.faultThread && th.id === a.faultThread.id ? (d.exception ? ' [CRASHED]' : ' [MAIN]') : (a.mainThread && th.id === a.mainThread.id ? ' [MAIN]' : ''));
    L.push(`thread ${th.id}${th.name ? ' "' + th.name + '"' : ''}${th.queue && th.queue !== th.name ? ' queue=' + th.queue : ''}${tag}  state=${r ? r.state : '?'}${th.samples !== undefined ? '  samples=' + th.samples : ''}`);
    frames.slice(0, 16).forEach((f, i) => L.push(`   ${String(i).padStart(2)}  ${f.sym}`));
  }
  L.push('', `=== NON-SYSTEM MODULES: plugins, drivers, vendor components (${a.thirdParty.length}) ===`, '(kind after the version says who owns each module; "shared component from the application vendor" is the DAW maker\'s own code, not a third-party plugin)');
  for (const m of a.thirdParty) L.push(`  ${pad(m.name, 40)} ${pad(m.fileVersion || '-', 16)} ${T('mk.' + m.kind)}${m.vendor ? ' / ' + m.vendor : ''}  ${m.path}`);
  if (!mac && d.unloaded.length) { L.push('', '=== UNLOADED MODULES ==='); for (const u of d.unloaded) L.push(`  ${u.name}  ${u.path}`); }
  L.push('', '=== END ===');
  return L.join('\n').replace(/\r?\n/g, '\r\n') + '\r\n';
}

/* ----------------------------------------------------------------------------
 * ANONYMISER — removes Windows user names from exported text.
 *   1) "\Users\<name>\" (and "/Users/<name>/") -> "\Users\<user>\"
 *   2) every user name found in module paths, as a whole word -> "<user>"

                anon: true, hideMem: false, dir: null, timer: null, msgs: [], notes: [] };

const fileKey = (f) => `${f.name}|${f.size}|${f.lastModified}`;
/** Route a mixed list of files: minidumps are analysed, module files (.dll/.vst3/.exe/.clap)
 *  are parsed as PE images and attached to every dump (exact build match), the rest ignored. */
async function loadFiles(files) {
  const dumps = files.filter(f => DUMP_RE.test(f.name));
  const pes = files.filter(f => PE_RE.test(f.name));
  for (const f of pes) {
    if (f.size > PE_MAX) { state.msgs.push(T('ui.peSkip', { name: f.name, msg: CDV.fmtSize(f.size) })); continue; }
    if (state.pe.some(P => P.key === fileKey(f))) continue;

      const P = CDV.parsePE(await f.arrayBuffer(), f.name);
      P.key = fileKey(f);
      state.pe.push(P);
    } catch (e) { state.msgs.push(T('ui.peSkip', { name: f.name, msg: e.message })); }
  }

  for (const f of dumps) {
    const key = fileKey(f);
    if (state.items.some(it => it.key === key)) continue;

 *  readEntries() returns batches (Chrome: 100 entries); it must be called until it returns []. */
async function walkEntries(entries) {

    // readEntries() when the dropped item's path cannot be mapped to its internal filesystem: URL
    // (seen with a folder named "@Source"). Count it and let the caller fall back (1.5.0).
    if (e.isFile) { try { out.push(await new Promise((res, rej) => e.file(res, rej))); } catch (x) { failed++; } }

        do { batch = await new Promise((res, rej) => r.readEntries(res, rej)); for (const x of batch) await walk(x); } while (batch.length);

  }
  for (const e of entries) await walk(e);

}

async function watchFolder() {

async function rescan() {

/** Small rendering helpers: pill badge, key/value grid (rows [key, value, rawHTML?]; empty values
 *  are skipped), one-line module label with kind/vendor/PE badges, thread label "id "name"". */
const pill = (txt, cls) => `<span class="pill ${cls || ''}">${esc(txt)}</span>`;
const kv = (rows) => `<div class="kv">${rows.filter(r => r && r[1] !== undefined && r[1] !== null && r[1] !== '').map(([k, v, raw]) => `<div>${esc(k)}</div><div>${raw ? v : esc(v)}</div>`).join('')}</div>`;
const modLine = (m) => `<span class="mono">${esc(m.name)}</span> ${pill(T('mk.' + m.kind))}${m.vendor ? pill(m.vendor) : ''}${m.pe ? pill('PE ✓') : ''}`;
const tlabel = (th) => `${th.id}${th.name ? ' "' + th.name + '"' : ''}`;

/** Diagnosis tab: verdict, culprit, findings, actions, warnings, memory, threads, suspects. */
function renderDiag(d, a) {
  const cm = a.culprit.module;
  let h = `<div class="card verdict ${a.kind}"><div class="muted">${esc(T('kind.' + a.kind))} · ${esc(a.hostLabel)} · ${esc(T(d.platform === 'mac' ? 'platform.mac' : 'platform.win'))} · ${esc(CDV.fmtTime(a.dumpTime))}</div>
    <div class="big">${esc(T(a.verdict.key, a.verdict.vars))}</div>
    ${pill(T('l.confidence') + ': ' + T('conf.' + a.culprit.confidence), a.culprit.confidence)}
    ${a.score && cm ? pill(T('l.scoreOf', { v: a.score.value }), a.score.value >= 70 ? 'high' : a.score.value > 50 ? 'medium' : 'low') : ''}
    ${a.signature ? `<span class="pill sig" title="${esc(a.signature.text + ' — ' + T('l.sigHint'))}">${esc(T('l.signature'))}: ${esc(a.signature.id)}</span>` : ''}
    ${d.platform === 'mac' ? `<div class="muted" style="margin-top:6px">β ${esc(T('ui.macBeta'))}</div>` : ''}</div>`;
  h += `<div class="card"><h2>${esc(T('h.culprit'))}</h2>`;
  h += cm ? kv([[T('l.module'), modLine(cm), true], [T('l.version'), cm.fileVersion || '-'], [T('l.vendor'), cm.vendor || T('l.unknown')],
                [T('l.path'), `<span class="mono">${esc(cm.path)}</span>`, true], [T('l.reason'), T('reason.' + a.culprit.reason)]])
          : `<p>${esc(T('reason.none'))}</p>`;
  h += `</div>`;
  // 1.6.0: the score and every piece of evidence behind it (sign + text), with a bar.
  if (a.score && cm) h += `<div class="card"><h2>${esc(T('h.score'))} — ${a.score.value}/100</h2><div><span class="bar" style="width:${Math.round(a.score.value * 2.4)}px;background:${a.score.value >= 70 ? 'var(--ok)' : a.score.value > 50 ? 'var(--hang)' : 'var(--crash)'}"></span></div>
    <ul class="clean">${a.score.evidence.map(x => `<li><b class="mono ${x.pts < 0 ? 'err' : ''}">${x.pts >= 0 ? '+' : ''}${x.pts}</b> ${esc(T(x.key, x.vars))}</li>`).join('')}</ul></div>`;
  h += renderNotes(d, a);
  h += `<div class="card"><h2>${esc(T('h.what'))}</h2><ul class="clean">${a.findings.map(f => `<li>${esc(T(f.key, f.vars))}</li>`).join('')}</ul></div>`;
  h += `<div class="card"><h2>${esc(T('h.todo'))}</h2><ol class="clean">${a.actions.map(x => `<li>${esc(T(x.key, x.vars))}</li>`).join('')}</ol></div>`;
  if (a.warnings.length) h += `<div class="card warncard"><h2>⚠ ${esc(T('h.warnings2'))}</h2><ul class="clean">${a.warnings.map(w => `<li>${esc(T(w.key, w.vars))}</li>`).join('')}</ul></div>`;
  if (a.mem) h += `<div class="card"><h2>${esc(T('h.memory'))}</h2>${memKV(a.mem)}</div>`;
  // 1.6.0 diagrams
  const sm = stackMapSVG(d, a), tm = threadMapSVG(d, a);
  if (sm) h += `<div class="card"><h2>${esc(T('h.stackMap'))}</h2>${sm}</div>`;
  if (tm) h += `<div class="card"><h2>${esc(T('h.threadMap'))}</h2>${tm}</div>`;
  h += renderThreadsOv(d, a, true);
  if (a.suspects.length) h += `<div class="card"><h2>${esc(T('h.suspects'))}</h2>${a.suspects.map(m => `<div>${modLine(m)}</div>`).join('')}</div>`;
  h += `<div class="card"><h2>${esc(T('h.third'))} (${a.thirdParty.length})</h2><div class="tablewrap"><table><thead><tr><th>${esc(T('l.module'))}</th><th>${esc(T('l.kind'))}</th><th>${esc(T('l.vendor'))}</th><th>${esc(T('l.version'))}</th><th>${esc(T('l.timestamp'))}</th></tr></thead><tbody>`;
  for (const m of a.thirdParty) h += `<tr class="${cm && m === cm ? 'hl' : ''}"><td class="mono" title="${esc(m.path)}">${esc(m.name)}</td><td>${esc(T('mk.' + m.kind))}</td><td>${esc(m.vendor || '')}</td><td class="mono">${esc(m.fileVersion)}</td><td>${esc(CDV.fmtTime(m.timestamp).slice(0, 10))}</td></tr>`;
  return h + `</tbody></table></div></div>`;
}
/** "My notes" card: notes matching the culprit / stack modules + form to add one. */
function renderNotes(d, a) {
  const list = CDV.notesForDump(state.notes, a);
  const mods = [a.culprit.module, ...a.suspects, ...a.thirdParty].filter((m, i, arr) => m && m.name && arr.findIndex(x => x && x.name === m.name) === i);
  if (!mods.length) return '';
  let h = `<div class="card"><h2>📝 ${esc(T('h.notes'))}</h2>`;
  if (list.length) h += `<ul class="clean">${list.map(n => `<li><b class="mono">${esc(n.module)}${n.version && n.version !== '*' ? ' ' + esc(n.version) : ''}</b> <span class="muted">${esc(n.date)}</span> — ${esc(n.text)} <button class="btn" data-delnote="${state.notes.indexOf(n)}">${esc(T('l.del'))}</button></li>`).join('')}</ul>`;
  h += `<div class="toolbar" style="margin-top:8px"><select id="noteModule">${mods.map(m => `<option value="${esc(m.name)}">${esc(m.name)} ${esc(m.fileVersion || '')}</option>`).join('')}</select>
    <label class="chk"><input type="checkbox" id="noteOnlyVer"> ${esc(T('l.onlyVer', { v: '' }).trim())}</label></div>
    <textarea id="noteText" class="support" style="min-height:60px" placeholder="${esc(T('l.notePh'))}"></textarea>
    <div class="toolbar" style="margin-top:6px"><button class="btn primary" id="btnAddNote">${esc(T('l.addNote'))}</button><span class="muted">${esc(T('l.noteHint'))}</span></div></div>`;
  return h;
}

/** Memory key/values with percentages; values over thresholds are highlighted. */
function memKV(M) {
  const z = (v) => (v === null || v === undefined ? '' : CDV.fmtSize(v));
  const flag = (txt, bad) => (bad ? `<b class="err">${esc(txt)}</b>` : esc(txt));
  return kv([
    [T('l.private'), flag(`${z(M.priv)}${M.procPct !== undefined ? ` (${M.procPct}% RAM)` : ''}`, M.bigProc), true],
    [T('l.ws'), `${z(M.ws)} (${z(M.peakWs)})`],
    [T('l.pagefile'), z(M.pagefile)],
    [T('l.ramTotal'), z(M.total)],
    [T('l.ramAvail'), flag(`${z(M.avail)}${M.availPct !== undefined ? ` (${M.availPct}%)` : ''}`, M.lowRam), true],
    [T('l.commit'), flag(`${z(M.commit)} / ${z(M.commitLimit)}${M.commitPct !== undefined ? ` (${M.commitPct}%)` : ''}`, M.highCommit), true]
  ]);
}
/** Thread map (1.6.0): one box per relevant thread (crashed, main, threads carrying the culprit or
 *  running third-party code; at most 12). Dashed links join waiting threads that share the culprit
 *  (the "possible deadlock" relation). Pure inline SVG, themed through CSS variables. */
function threadMapSVG(d, a) {
  const ov = a.threadsOv; if (!ov) return '';
  const cul = a.culprit.module;
  const isKey = (th) => (a.faultThread && th.id === a.faultThread.id) || (a.mainThread && th.id === a.mainThread.id);
  let list = d.threads.filter(th => { const r = ov.rows.get(th.id); return r && (isKey(th) || r.hasCulprit || r.state === 'third'); });
  if (list.length > 12) list = list.filter(th => isKey(th) || ov.rows.get(th.id).hasCulprit).slice(0, 12);
  if (!list.length) return '';
  const cols = Math.min(4, list.length), BW = 210, BH = 58, GX = 18, GY = 22, W = cols * (BW + GX) + GX, rows = Math.ceil(list.length / cols), H = rows * (BH + GY) + GY + 14;
  const pos = (i) => ({ x: GX + (i % cols) * (BW + GX), y: GY + Math.floor(i / cols) * (BH + GY) });
  const trunc = (t, n) => (t.length > n ? t.slice(0, n - 1) + '…' : t);
  let g = '';
  // Deadlock links: main thread <-> other waiting threads with the culprit on their stack.
  if (a.deadlock && a.mainThread) {
    const mi = list.findIndex(th => th.id === a.mainThread.id);
    list.forEach((th, i) => { const r = ov.rows.get(th.id); if (i !== mi && mi >= 0 && r.state === 'wait' && r.hasCulprit) {
      const p1 = pos(mi), p2 = pos(i); g += `<path class="link" d="M${p1.x + BW / 2} ${p1.y + BH / 2} L${p2.x + BW / 2} ${p2.y + BH / 2}"/>`; } });
  }
  list.forEach((th, i) => {
    const r = ov.rows.get(th.id), p = pos(i), fault = a.faultThread && th.id === a.faultThread.id, main = a.mainThread && th.id === a.mainThread.id;
    g += `<rect class="box ${fault ? 'fault' : main ? 'main' : ''}" x="${p.x}" y="${p.y}" width="${BW}" height="${BH}" rx="6"/>`;
    g += `<text x="${p.x + 8}" y="${p.y + 16}" font-weight="600">${esc(trunc(`${th.id}${th.name ? ' ' + th.name : ''}`, 30))}${fault && d.exception ? ' ⚠' : main ? ' ★' : ''}</text>`;
    g += `<text x="${p.x + 8}" y="${p.y + 32}" class="muted">${esc(T('st.' + r.state))}</text>`;
    g += `<text x="${p.x + 8}" y="${p.y + 48}" font-family="var(--mono)">${esc(trunc(r.top ? r.top.name : '', 32))}${r.hasCulprit ? ' ●' : ''}</text>`;
  });
  g += `<text x="${GX}" y="${H - 4}" class="muted">${d.exception ? '⚠ ' + esc(T('l.thread') + ' ' + (a.faultThread ? a.faultThread.id : '')) + ' · ' : ''}★ ${esc(T('role.main'))}${cul ? ' · ● ' + esc(cul.name) : ''}${a.deadlock ? ' · - - - ' + esc(T('f.deadlock').split(':')[0]) : ''}</text>`;
  return `<svg class="diagram" style="max-width:${W}px" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(T('h.threadMap'))}">${g}</svg>`;
}
/** Stack map (1.6.0): the analysed thread's frames as one bar per frame (leaf at the top), coloured by
 *  who owns the code: system / runtime, the application, third-party, and the culprit. Makes
 *  "the fault is in Windows but it was called from Serum" visible at a glance. */
function stackMapSVG(d, a) {
  const frames = a.frames.slice(0, 24); if (!frames.length) return '';
  const cul = a.culprit.module, RH = 16, W = 760, H = frames.length * RH + 8;
  const cls = (m) => (!m ? 'sys' : cul && m === cul ? 'culprit' : CDV.isSystemish(m) ? 'sys' : (m.kind === 'host' || m.kind === 'host-component') ? 'host' : 'third');
  let g = '';
  frames.forEach((f, i) => {
    const y = 4 + i * RH, m = f.module, c = cls(m), depth = Math.min(10, i);
    g += `<rect class="fr ${c}" x="${4 + depth * 6}" y="${y}" width="${W - 8 - depth * 6}" height="${RH - 2}" rx="3"/>`;
    g += `<text x="${10 + depth * 6}" y="${y + 11}" font-family="var(--mono)" font-size="10.5">${esc(String(i).padStart(2))}  ${esc(f.sym.length > 90 ? f.sym.slice(0, 89) + '…' : f.sym)}</text>`;
  });
  return `<svg class="diagram" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(T('h.stackMap'))}">${g}</svg>
    <p class="muted" style="margin:6px 0 0"><span class="pill" style="background:var(--crash-weak);border-color:var(--crash)">${esc(T('l.culpritHere'))}</span> <span class="pill" style="background:var(--hang-weak)">${esc(T('mk.thirdparty'))}</span> <span class="pill" style="background:var(--accent-weak)">${esc(T('mk.host'))}</span> <span class="pill">${esc(T(d.platform === 'mac' ? 'platform.mac' : 'mk.system'))} / ${esc(T('mk.runtime'))}</span></p>`;
}
/** All-threads overview: summary line + every thread that is not idle-waiting,
 *  plus main/fault thread and threads carrying the culprit module. */
function renderThreadsOv(d, a, compact) {
  const ov = a.threadsOv; if (!ov) return '';
  let h = `<div class="card"><h2>${esc(T('h.threadsOv'))}</h2><p>${esc(T('f.threadsSum', { total: ov.total, wait: ov.wait, third: ov.third.length }))}</p>
    <div class="tablewrap" style="max-height:${compact ? '40vh' : '70vh'}"><table><thead><tr><th>ID</th><th>${esc(T('l.name'))}</th><th>${esc(T('l.state'))}</th><th>${esc(T('l.topMod'))}</th><th></th></tr></thead><tbody>`;
  for (const th of d.threads) {
    const r = ov.rows.get(th.id); if (!r) continue;
    const isKey = (a.faultThread && th.id === a.faultThread.id) || (a.mainThread && th.id === a.mainThread.id);
    if (compact && r.state === 'wait' && !r.hasCulprit && !isKey) continue;
    h += `<tr class="${isKey ? 'hl' : ''}"><td class="mono">${th.id}</td><td>${esc(th.name)}</td><td>${esc(T('st.' + r.state))}</td><td class="mono">${esc(r.top ? r.top.name : '')}</td><td>${r.hasCulprit ? pill(T('l.culpritHere'), 'high') : ''}</td></tr>`;
  }
  return h + `</tbody></table></div></div>`;
}

/** Support summary tab: English text for the vendor, anonymised when the option is on. */
function supportText(d, a) {
  return finalText(CDV.buildSupportText(d, a, exportOpts()));
}
/** Support summary tab: read-only textarea + Copy button (clipboard API, execCommand fallback). */
function renderSupport(d, a) {
  return `<div class="card"><h2>${esc(T('h.support'))}</h2>
    <div class="toolbar"><button class="btn primary" id="btnCopy">${esc(T('l.copy'))}</button><span id="copyMsg" class="muted"></span></div>
    <textarea class="support" id="supportTxt" readonly>${esc(supportText(d, a))}</textarea></div>
    <div class="card"><h2>${esc(T('ui.aiCopy'))}</h2><p class="muted">${esc(T('ui.aiHint'))}</p>
    <div class="toolbar"><button class="btn primary" id="btnAI">${esc(T('ui.aiCopy'))}</button><button class="btn" id="btnAIDl">${esc(T('ui.aiDownload'))}</button><span id="aiMsg" class="muted"></span></div>
    <textarea class="support" id="aiTxt" readonly style="min-height:160px">${esc(finalText(CDV.buildAIPrompt(d, a, exportOpts())))}</textarea></div>`;
}
/** Copy / download the AI prompt (anonymised like every export). */
async function copyAI() {
  const ta = $('#aiTxt'); if (!ta) return;
  let ok = false;
  try { await navigator.clipboard.writeText(ta.value); ok = true; } catch (e) { /* fall back */ }
  if (!ok) { ta.focus(); ta.select(); try { ok = document.execCommand('copy'); } catch (e) { ok = false; } }
  $('#aiMsg').textContent = ok ? T('l.copiedAI') : '';
}
function downloadAI() { const it = current(); if (!it || !it.d) return; download(it.file.replace(/\.[^.]+$/, '') + '.ai-prompt.txt', CDV.buildAIPrompt(it.d, it.a, exportOpts())); }
/** Copy the support summary. navigator.clipboard needs a secure context (https or file:// in
 *  Chrome); when it is unavailable the textarea is selected and execCommand('copy') is used. */
async function copySupport() {
  const ta = $('#supportTxt'); if (!ta) return;
  let ok = false;
  try { await navigator.clipboard.writeText(ta.value); ok = true; } catch (e) { /* not a secure context: fall back */ }
  if (!ok) { ta.focus(); ta.select(); try { ok = document.execCommand('copy'); } catch (e) { ok = false; } }
  $('#copyMsg').textContent = ok ? T('l.copied') : '';
}

/** Exception tab: record, parameters, registers (symbolised), code bytes around IP. */
/** macOS exception card: type/signal/codes/subtype, faulting address, ASI, termination; then registers. */
function renderExcMac(d, a) {
  const ex = d.exception, M = d.mac, W = a.ptrWidth;
  let h = `<div class="card"><h2>${esc(T('h.exception'))}</h2>` + kv([
    [T('l.code'), `${ex.type}${ex.signal ? ' (' + ex.signal + ')' : ''}`], ['', T(a.exc.descKey)],
    [T('l.excCodes'), ex.codes], [T('l.subtype'), ex.subtype],
    [T('l.address'), `${CDV.hex(ex.address, W)}  (${a.faultSym})`],
    [T('l.thread'), `${ex.threadId}${a.faultThread && a.faultThread.name ? ' "' + a.faultThread.name + '"' : ''} — ${T('role.' + (a.faultRole || 'worker'))}`],
    [T('h.termination'), M.termination ? [M.termination.namespace, M.termination.code, M.termination.indicator].filter(x => x !== undefined && x !== '').join(' ') : '']
  ]);
  const avF = a.findings.find(f => f.key.startsWith('f.av.'));
  if (avF) h += `<p>${esc(T(avF.key, avF.vars))}</p>`;
  h += `</div>`;
  if (M.asi) h += `<div class="card"><h2>${esc(T('h.asi'))}</h2><pre>${esc(M.asi)}</pre></div>`;
  h += renderRegs(d, a, a.faultCtx && a.faultCtx.regs.length ? a.faultCtx : null);
  if (M.vmRegionInfo) h += `<div class="card"><h2>${esc(T('h.vmRegion'))}</h2><pre>${esc(M.vmRegionInfo)}</pre></div>`;
  return h;
}
/** Raw report tab (macOS): header line, exception/termination/ASI objects as received. */
function renderRawMac(d) {
  const R = d.mac.raw || {};
  const j = (o) => esc(JSON.stringify(o, null, 2));
  let h = `<div class="card"><h2>${esc(T('h.header'))}</h2><pre>${j(R.header || {})}</pre></div>`;
  h += `<div class="card"><h2>${esc(T('h.exception'))} / ${esc(T('h.termination'))}</h2><pre>${j({ exception: R.exception || null, termination: R.termination || null, asi: R.asi || null, legacyInfo: R.legacyInfo || undefined })}</pre></div>`;
  h += `<div class="card"><h2>${esc(T('h.modules'))} (${d.modules.length})</h2><div class="tablewrap"><table><thead><tr><th>${esc(T('l.module'))}</th><th>${esc(T('l.arch'))}</th><th>${esc(T('l.base'))}</th><th>${esc(T('l.size'))}</th><th>${esc(T('l.uuid'))}</th><th>${esc(T('l.path'))}</th></tr></thead><tbody>`;
  for (const m of d.modules) h += `<tr class="k-${m.kind}"><td class="mono">${esc(m.imageName || m.name)}</td><td>${esc(m.arch)}</td><td class="mono">${CDV.hex(m.base, 16)}</td><td>${CDV.fmtSize(m.size)}</td><td class="mono">${esc(m.pdbId)}</td><td class="mono">${esc(m.path)}</td></tr>`;
  h += `</tbody></table></div></div>`;
  if (d.warnings.length) h += `<div class="card"><h2>${esc(T('h.warnings'))}</h2><ul class="clean">${d.warnings.map(w => `<li class="warn">${esc(w)}</li>`).join('')}</ul></div>`;
  return h;
}
/** Exception tab (Windows): exception record, parameters with symbolised pointers, decoded
 *  faulting instruction, registers and 64 code bytes around IP (dump memory or loaded PE file).
 *  macOS reports go to renderExcMac(); freezes/snapshots show only the registers of the main thread. */
function renderExc(d, a) {
  const W = a.ptrWidth;
  if (d.platform === 'mac' && d.exception) return renderExcMac(d, a);
  if (!d.exception) return `<div class="card"><p>${esc(T(a.kind === 'hang' ? 'f.hang' : 'f.snapshot'))}</p></div>` + renderRegs(d, a, a.faultThread && a.faultThread.ctx);
  const ex = d.exception;
  let h = `<div class="card"><h2>${esc(T('h.exception'))}</h2>` + kv([
    [T('l.code'), `${a.exc.codeHex} ${a.exc.name}`], ['', T(a.exc.descKey)],
    [T('l.address'), `${CDV.hex(ex.address, W)}  (${a.faultSym})`],
    [T('l.thread'), `${ex.threadId}${a.faultThread && a.faultThread.name ? ' "' + a.faultThread.name + '"' : ''} — ${T('role.' + (a.faultRole || 'worker'))}`],
    [T('l.flags'), CDV.hex(ex.flags, 8) + (ex.flags & 1 ? ' (EXCEPTION_NONCONTINUABLE)' : '')]
  ]) + `</div>`;
  if (ex.params.length) {
    h += `<div class="card"><h2>${esc(T('h.params'))}</h2><table><thead><tr><th>#</th><th>${esc(T('l.value'))}</th><th>${esc(T('l.points'))}</th></tr></thead><tbody>`;
    ex.params.forEach((p, i) => { const s = CDV.symbolize(d, p, W); h += `<tr><td>${i}</td><td class="mono">${CDV.hex(p, W)}</td><td class="mono">${s.module || s.unloaded ? esc(s.text) : ''}</td></tr>`; });
    h += `</tbody></table>`;
    const avF = a.findings.find(f => f.key.startsWith('f.av.'));
    if (avF) h += `<p>${esc(T(avF.key, avF.vars))}</p>`;
    h += `</div>`;
  }
  if (a.instr) {
    const I = a.instr;
    h += `<div class="card"><h2>${esc(T('h.instr'))}</h2>` + kv([
      [T('l.asm'), `<span class="mono">${esc(I.asm)}</span>`, true], [T('l.bytes'), `<span class="mono">${esc(I.bytes)}</span>`, true],
      [T('l.regsUsed'), I.regs.map(r => `${r.name.toUpperCase()} = ${CDV.hex(r.value, W)}`).join(', ')],
      [T('l.ea'), I.ea !== undefined ? `${CDV.hex(I.ea, W)}${I.eaMatches === null ? '' : ' — ' + T(I.eaMatches ? 'l.eaMatch' : 'l.eaNoMatch')}` : '']
    ]) + `<ul class="clean">${a.findings.filter(f => f.key.startsWith('f.instr.')).map(f => `<li>${esc(T(f.key, f.vars))}</li>`).join('')}</ul></div>`;
  }
  h += renderRegs(d, a, a.faultCtx);
  // Code bytes: 32 before / 32 after the instruction pointer (dump memory or loaded module file).
  if (a.faultCtx && a.faultCtx.ip) {
    const ip = a.faultCtx.ip, before = 32n;
    let bytes = CDV.readCode(d, ip - before, 64), base = ip - before;
    if (!bytes) { bytes = CDV.readCode(d, ip, 32); base = ip; }
    h += `<div class="card"><h2>${esc(T('h.code'))}</h2>`;
    if (bytes) {
      let txt = '';
      for (let i = 0; i < bytes.length; i += 16) {
        const addr = base + BigInt(i);
        txt += CDV.hex(addr, W) + '  ' + Array.from(bytes.subarray(i, i + 16)).map((b, j) => (base + BigInt(i + j) === ip ? '[' : ' ') + b.toString(16).padStart(2, '0').toUpperCase()).join('') + '\n';
      }
      h += `<pre>${esc(txt)}</pre><p class="muted">[ = IP</p>`;
    } else h += `<p class="muted">${esc(T('l.notCaptured'))}</p>`;
    h += `</div>`;
  }
  return h;
}
/** Registers table of a CONTEXT: value + the module/offset it points into, if any. */
function renderRegs(d, a, ctx) {

  let h = `<div class="card"><h2>${esc(T('h.regs'))} (${esc(ctx.arch)})</h2><table><thead><tr><th>Reg</th><th>${esc(T('l.value'))}</th><th>${esc(T('l.points'))}</th></tr></thead><tbody>`;

/** Stack tab: thread selector + frames (exact unwind where module files are loaded, else scan). */
function renderStack(d, a) {
  const tid = state.stackTid ?? (a.faultThread ? a.faultThread.id : d.threads[0] && d.threads[0].id);
  const th = d.threads.find(t => t.id === tid);
  const useExcCtx = d.exception && th && th.id === d.exception.threadId;
  const frames = th ? (a.faultThread && th.id === a.faultThread.id ? a.frames : CDV.scanStack(d, th, useExcCtx ? a.faultCtx : th.ctx)) : [];
  const opts = d.threads.map(t => {
    const mark = a.faultThread && t.id === a.faultThread.id ? (d.exception ? ' ⚠' : ' ★') : (a.mainThread && t.id === a.mainThread.id ? ' ★' : '');
    return `<option value="${t.id}" ${t.id === tid ? 'selected' : ''}>${t.id}${t.name ? ' — ' + esc(t.name) : ''}${mark}</option>`;

  let h = `<div class="card"><h2>${esc(T('h.stack'))}</h2><div class="toolbar"><label>${esc(T('l.selThread'))} <select id="stackSel">${opts}</select></label></div>
    <p class="muted">${esc(T(d.platform === 'mac' ? 'f.mac.frames' : frames.some(f => f.method === 'unwind') ? 'f.unwound' : 'f.heuristic', { n: frames.filter(f => f.method === 'unwind').length }))}</p>`;

/** Timeline: one lane per application version, one dot per dump (red crash, amber freeze). */
function timelineSVG(rows) {
  if (!rows.length) return '';
  const lanes = [...new Set(rows.map(r => r.host))];
  const W = 900, left = 170, right = 70, laneH = 46, top = 24, H = top + lanes.length * laneH + 28;
  const t0 = rows[0].time, t1 = rows[rows.length - 1].time, span = Math.max(1, t1 - t0);
  const x = (t) => left + (rows.length === 1 ? 0.5 : (t - t0) / span) * (W - left - right);
  let g = '';
  lanes.forEach((l, i) => {
    const y = top + i * laneH + laneH / 2;
    g += `<line class="lane" x1="${left}" x2="${W - right}" y1="${y}" y2="${y}"/><text x="8" y="${y + 4}">${esc(l)}</text>`;
  });
  const lastX = new Map(), flip = new Map();   // per lane: x of previous dot, label side
  for (const r of rows) {
    const y = top + lanes.indexOf(r.host) * laneH + laneH / 2, cx = x(r.time);
    // Dots closer than 90 px in the same lane alternate their label above / below.
    const near = lastX.has(r.host) && cx - lastX.get(r.host) < 90;
    const below = near ? !flip.get(r.host) : false;
    lastX.set(r.host, cx); flip.set(r.host, below);
    const color = r.kind === 'crash' ? 'var(--crash)' : r.kind === 'hang' ? 'var(--hang)' : 'var(--accent)';
    const lab = (r.culprit || '-').replace(/\.(vst3|dll|component|vst|clap)$/i, '');
    g += `<circle cx="${cx.toFixed(1)}" cy="${y}" r="7" style="fill:${color}"><title>${esc(CDV.fmtTime(r.time))} · ${esc(T('kind.' + r.kind))} · ${esc(r.culprit || '-')}</title></circle>`;
    g += `<text x="${cx.toFixed(1)}" y="${below ? y + 20 : y - 11}" text-anchor="middle">${esc(lab.length > 16 ? lab.slice(0, 15) + '…' : lab)}</text>`;
  }
  g += `<text x="${left}" y="${H - 8}">${esc(CDV.fmtTime(t0).slice(0, 10))}</text><text x="${W - right}" y="${H - 8}" text-anchor="end">${esc(CDV.fmtTime(t1).slice(0, 10))}</text>`;
  return `<svg class="timeline" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(T('h.timeline'))}">${g}</svg>`;
}

  for (const r of c.rows) h += `<tr><td>${esc(CDV.fmtTime(r.time))}</td><td>${esc(r.host)}</td><td>${esc(T('kind.' + r.kind))}</td><td class="mono">${esc(r.code)} ${esc(r.codeName)}</td>

  h += `</tbody></table></div></div>`;
  h += `<div class="card"><h2>${esc(T('h.cmpNotes'))}</h2><ul class="clean">${c.notes.map(n => `<li>${esc(CDV.noteText(state.lang, n))}</li>`).join('')}</ul></div>`;
  const max = Math.max(1, ...c.freq.map(f => f[1]));
  h += `<div class="card"><h2>${esc(T('h.freq'))}</h2>${c.freq.map(([n, k, kind]) => `<div><span class="bar" style="width:${Math.round(k / max * 160)}px"></span><b>${k}×</b> <span class="mono">${esc(n)}</span> ${pill(T('mk.' + kind))}</div>`).join('') || esc(T('l.none'))}</div>`;
  h += `<div class="card"><h2>${esc(T('h.changes'))}</h2><p class="muted">${esc(T('l.changesNote'))}</p><div class="tablewrap" style="max-height:50vh"><table><thead><tr><th>${esc(T('l.time'))}</th><th>${esc(T('l.updated'))}</th><th>${esc(T('l.firstSeen'))}</th></tr></thead><tbody>`;
  for (const ch of c.changes) {
    if (ch.baseline) { h += `<tr><td>${esc(CDV.fmtTime(ch.time))}</td><td colspan="2" class="muted">${esc(T('l.baseline'))}</td></tr>`; continue; }

  }
  h += `</tbody></table></div></div>`;
  if (c.versions.length) {
    h += `<div class="card"><h2>${esc(T('h.versions'))}</h2><div class="tablewrap" style="max-height:50vh"><table><thead><tr><th>${esc(T('l.module'))}</th><th>${esc(T('l.time'))}</th><th>${esc(T('l.version'))}</th><th></th></tr></thead><tbody>`;
    for (const v of c.versions) v.events.forEach((e, i) => {

  return h;
}

/* ---------- export (.txt, UTF-8 with BOM so Notepad shows accents; optional anonymisation) ---------- */
/** Anonymisation for everything that leaves the page: user names + non-standard folders. */
function finalText(text) {
  return state.anon ? CDV.anonymizeAll(text, CDV.privacyTokens(state.items.filter(i => i.d).map(i => i.d))) : text;
}
/** Trigger a browser download. Text exports get a UTF-8 BOM (so Windows Notepad / Excel detect
 *  the encoding); JSON and HTML must not (JSON.parse and browsers would choke on it). `raw` skips
 *  anonymisation for content that is already anonymised (HTML report) or has nothing to hide (notes). */
function download(name, text, mime, raw) {
  const body = raw ? text : finalText(text);
  const blob = new Blob([mime === 'application/json' || mime === 'text/html' ? body : '\uFEFF' + body], { type: (mime || 'text/plain') + ';charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
/** "Export report (.txt)": the selected dump, or the comparison when that view is open. */
function exportOne() {
  if (state.sel === 'compare') { download('crash-dump-comparison.txt', CDV.buildCompareText(state.items.filter(i => i.d), state.lang)); return; }
  const it = current(); if (!it || !it.d) return;
  download(it.file.replace(/\.[^.]+$/, '') + '.report.txt', CDV.buildTextReport(it.d, it.a, state.lang, state.notes, exportOpts()));
}
/** "Export all (.txt)": comparison first, then one report per dump, separated by a line of '#'. */
function exportAll() {
  const ok = state.items.filter(i => i.d).sort((x, y) => x.d.header.timestamp - y.d.header.timestamp);
  if (!ok.length) return;
  let txt = CDV.buildCompareText(ok, state.lang);
  for (const it of ok) txt += '\r\n\r\n' + '#'.repeat(78) + '\r\n\r\n' + CDV.buildTextReport(it.d, it.a, state.lang, state.notes, exportOpts());
  download('crash-dump-reports.txt', txt);
}
/** Items covered by the current selection: one dump, or all of them in the comparison view. */
function selectedItems() {
  if (state.sel === 'compare') return state.items.filter(i => i.d);
  const it = current(); return it && it.d ? [it] : [];
}
/** Privacy tokens for the HTML report (null = "Anonymise exports" is off). */
function reportTokens() { return state.anon ? CDV.privacyTokens(state.items.filter(i => i.d).map(i => i.d)) : null; }
/** "Export report (.html)": self-contained document (own CSP, no scripts) built by the CORE. */
function exportHTML() {
  const sel = selectedItems(); if (!sel.length) return;
  const r = CDV.buildReportHTML(sel, state.lang, state.notes, reportTokens(), exportOpts());
  const name = sel.length > 1 ? 'crash-dump-report.html' : sel[0].file.replace(/\.[^.]+$/, '') + '.report.html';
  download(name, r.html, 'text/html', true);   // already anonymised inside the builder
}
/** "Print / PDF": the same HTML report is injected into #printArea, the only element visible
 *  under @media print, and the browser print dialog is opened (choose "Save as PDF" there). */
function printReport() {
  const sel = selectedItems(); if (!sel.length) return;
  const r = CDV.buildReportHTML(sel, state.lang, state.notes, reportTokens(), exportOpts());
  $('#printArea').innerHTML = `<style>${r.css}</style>${r.body}`;
  window.print();
}
/** Demo: synthetic dumps generated in memory, loaded like files. */
function loadDemo() {
  const files = CDV.demoDumps().map(x => new File([x.buffer], x.name, { lastModified: 1767225600000 }));   // 4 .dmp + 2 .ips
  loadFiles(files);
}
/** CSV (';' separated, Excel-friendly) and JSON exports of every loaded dump. */
function exportCSV() { download('crash-dumps.csv', CDV.buildCSV(state.items.filter(i => i.d), exportOpts()), 'text/csv'); }
function exportJSON() { download('crash-dumps.json', CDV.buildJSON(state.items.filter(i => i.d), exportOpts()), 'application/json'); }

/* ---------- personal notes (memory only; import/export as .json) ---------- */
async function importNotes(file) {
  try {
    const list = CDV.parseNotes(await file.text());
    for (const n of list) if (!state.notes.some(x => x.module === n.module && x.version === n.version && x.text === n.text)) state.notes.push(n);
    state.msgs.push(T('ui.notesLoaded', { n: list.length }));
  } catch (e) { state.msgs.push(T('ui.notesBad', { msg: e.message })); }
  render();
}
/** Notes: export to crash-dump-analyzer-notes.json; addNote() reads the form of the "My notes"
 *  card (module selector, "only this version" checkbox, text) and stamps today's date. */
function exportNotes() { download('crash-dump-analyzer-notes.json', CDV.serializeNotes(state.notes), 'application/json', true); }
function addNote() {
  const it = current(); if (!it || !it.d) return;
  const sel = $('#noteModule'), txt = $('#noteText'), only = $('#noteOnlyVer');
  const m = it.d.modules.find(x => x.name === sel.value); if (!m || !txt.value.trim()) return;
  const now = new Date(), p2 = (n) => String(n).padStart(2, '0');
  state.notes.push({ module: m.name, version: only.checked ? (m.fileVersion || '*') : '*', text: txt.value.trim(),
                     date: `${now.getFullYear()}-${p2(now.getMonth() + 1)}-${p2(now.getDate())}` });
  render();
}

/* ---------- events ---------- */
/* Header buttons open hidden <input type=file> elements; their change handlers reset the value
 * so that choosing the same file twice fires again. Folder picking uses webkitdirectory. */
$('#btnOpen').onclick = () => $('#fileInput').click();
// Copy buttons of the "Where are the dumps?" panel (main area and sidebar).
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-copy]'); if (!b) return;
  const ok = await copyText(DUMP_PATHS[Number(b.dataset.copy)].path);
  b.textContent = ok ? '✓' : '✗'; setTimeout(() => { b.textContent = T('l.copy'); }, 1200);
});
$('#fileInput').onchange = (e) => { loadFiles([...e.target.files]); e.target.value = ''; };
$('#btnFolder').onclick = () => $('#folderInput').click();
$('#folderInput').onchange = (e) => { loadFiles([...e.target.files]); e.target.value = ''; };
$('#btnPE').onclick = () => $('#peInput').click();
$('#peInput').onchange = (e) => { loadFiles([...e.target.files]); e.target.value = ''; };
$('#btnWatch').onclick = watchFolder;
$('#btnRescan').onclick = rescan;
$('#chkAuto').onchange = (e) => {
  clearInterval(state.timer); state.timer = null;
  if (e.target.checked) state.timer = setInterval(rescan, 15000);
};
$('#chkAnon').onchange = (e) => { state.anon = e.target.checked; if (state.tab === 'support') render(); };
$('#chkHideMem').onchange = (e) => { state.hideMem = e.target.checked; if (state.tab === 'support') render(); };
$('#btnExportOne').onclick = exportOne;
$('#btnCSV').onclick = exportCSV;
$('#btnHTML').onclick = exportHTML;
$('#btnPrint').onclick = printReport;
$('#btnDemo').onclick = loadDemo;
$('#btnJSON').onclick = exportJSON;
$('#btnNotesIn').onclick = () => $('#notesInput').click();
$('#notesInput').onchange = (e) => { if (e.target.files[0]) importNotes(e.target.files[0]); e.target.value = ''; };
$('#btnNotesOut').onclick = exportNotes;
$('#btnExportAll').onclick = exportAll;
// Clear removes dumps and module files; notes are kept (export them to save them).
$('#btnClear').onclick = () => { state.items = []; state.pe = []; state.sel = null; state.stackTid = null; state.msgs = []; render(); };
$('#langSeg').onclick = (e) => { const b = e.target.closest('button'); if (b) { state.lang = b.dataset.lang; render(); } };
$('#list').onclick = (e) => { const el = e.target.closest('.list-item'); if (!el) return; state.sel = el.dataset.id === 'compare' ? 'compare' : Number(el.dataset.id); state.stackTid = null; render(); };
/* The main area is rebuilt on every render, so its events are delegated from #main:
 * tab buttons, support Copy, Add note, demo button, note Remove buttons, thread selector of the
 * Stack tab, "hide Windows modules" toggle and the module filter (which keeps the caret). */
$('#main').addEventListener('click', (e) => {
  const b = e.target.closest('.tabs button'); if (b) { state.tab = b.dataset.tab; render(); return; }
  if (e.target.id === 'btnCopy') copySupport();
  if (e.target.id === 'btnAI') copyAI();
  if (e.target.id === 'btnAIDl') downloadAI();
  if (e.target.id === 'btnAddNote') addNote();
  if (e.target.dataset && e.target.dataset.demo) loadDemo();
  if (e.target.dataset && e.target.dataset.delnote !== undefined) { state.notes.splice(Number(e.target.dataset.delnote), 1); render(); }
});
$('#main').addEventListener('change', (e) => {
  if (e.target.id === 'stackSel') { state.stackTid = Number(e.target.value); render(); }
  if (e.target.id === 'hideSys') { state.hideSys = e.target.checked; render(); }
});
$('#main').addEventListener('input', (e) => {
  if (e.target.id === 'modFilter') {
    state.modFilter = e.target.value; const pos = e.target.selectionStart; render();
    const f = $('#modFilter'); if (f) { f.focus(); f.setSelectionRange(pos, pos); }
  }
});
// Drag & drop anywhere on the page: files, folders (recursively) and module files.
let dragDepth = 0;
window.addEventListener('dragenter', (e) => { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
window.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', async (e) => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
  const entries = entriesFromDrop(e.dataTransfer);           // synchronous, before any await
  const plain = [...(e.dataTransfer.files || [])];           // files only (a dropped folder shows up as a 0-byte File)
  let files = entries.length ? await walkEntries(entries) : plain;
  // Fallback (1.5.0): when the entry API failed (EncodingError on some paths), use the plain
  // file list; when nothing usable remains, tell the user to use the Open buttons instead.
  if (!files.length && entries.length) files = plain.filter(f => f.size > 0);
  if (files.length) loadFiles(files);
  else if (entries.length) { state.msgs.push(T('ui.dropFail')); state.msgs = state.msgs.slice(-4); render(); }
});
// English is the default language; ES / DE via the switch. First render shows the empty state.
render();
})();
</script>
