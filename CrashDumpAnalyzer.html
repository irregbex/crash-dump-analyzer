    if (a.instr) {
      L.push('', T('h.instr') + ':');
      L.push(`  ${a.instr.asm}    [${a.instr.bytes}]`);
      for (const r of a.instr.regs) L.push(`  ${pad(r.name, 5)} ${hex(r.value, W)}`);
      if (a.instr.ea !== undefined) L.push(`  ${T('l.ea')}: ${hex(a.instr.ea, W)}${a.instr.eaMatches === null ? '' : ' (' + T(a.instr.eaMatches ? 'l.eaMatch' : 'l.eaNoMatch') + ')'}`);
    }
    if (a.faultCtx) {
      L.push('', T('h.regs') + ':');
      for (const [n, v] of a.faultCtx.regs) {
        const s = symbolize(d, v, W);
        L.push(`  ${pad(n, 5)} ${hex(v, W)}${s.module || s.unloaded ? '  ' + s.text : ''}`);
      }
    }
  }
  if (a.faultThread) {
    L.push(S(T('r.stackOf', { tid: a.faultThread.id }) + ` (${T('role.' + (a.faultRole || 'worker'))})`));
    if (!a.frames.length) L.push(T('l.notCaptured'));
    a.frames.forEach((f, i) => L.push(`  ${pad(i, 3)} ${f.stackAddr ? hex(f.stackAddr, W) : pad('[IP]', W + 2)}  ${pad(f.sym, 52)} ${pad(T('m.' + (f.method || 'scan')), 18)} ${f.module ? T('mk.' + f.module.kind) : ''}`));
  }
  if (a.threadsOv) {
    const ov = a.threadsOv;
    L.push(S(T('h.threadsOv')));
    L.push(T('f.threadsSum', { total: ov.total, wait: ov.wait, third: ov.third.length }), '');
    for (const th of d.threads) {
      const r = ov.rows.get(th.id); if (!r) continue;
      const isKey = (a.faultThread && th.id === a.faultThread.id) || (a.mainThread && th.id === a.mainThread.id);
      if (r.state === 'wait' && !r.hasCulprit && !isKey) continue;   // idle threads omitted
      L.push(`  ${pad(th.id, 7)} ${pad(th.name || '', 24)} ${pad(T('st.' + r.state), 36)} ${r.top ? r.top.name : ''}${r.hasCulprit ? '  [' + T('l.culpritHere') + ']' : ''}`);
    }
  }
  L.push(S(T('h.system') + ' / ' + T('h.process')));
  if (d.system) {
    L.push(`${pad(T('l.os') + ':', 18)}${d.system.osName}`);
    if (d.misc && d.misc.buildString) L.push(`${pad(T('l.build') + ':', 18)}${d.misc.buildString}`);
    L.push(`${pad(T('l.cpu') + ':', 18)}${d.system.arch} ${d.system.vendor} (family ${d.system.level}), ${d.system.cpus} ${T('l.cpus').toLowerCase()}`);
  }
  if (d.misc) {
    if (d.misc.pid !== undefined) L.push(`${pad(T('l.pid') + ':', 18)}${d.misc.pid}`);
    if (d.misc.processCreateTime) L.push(`${pad(T('l.created') + ':', 18)}${fmtTime(d.misc.processCreateTime)}`);
    if (a.uptimeSec !== undefined) L.push(`${pad(T('l.uptime') + ':', 18)}${fmtDur(a.uptimeSec)}`);
    if (d.misc.integrity !== undefined) L.push(`${pad(T('l.integrity') + ':', 18)}${INTEGRITY[d.misc.integrity] || hex(d.misc.integrity)}`);
  }
  L.push(`${pad(T('l.file') + ':', 18)}${d.fileName} (${fmtSize(d.fileSize)})`);
  L.push(`${pad(T('l.dumpflags') + ':', 18)}${d.header.flagNames.join(', ') || '-'}`);
  L.push(S(T('h.third') + ` (${a.thirdParty.length})`));
  for (const m of a.thirdParty) L.push(`  ${pad(m.name, 40)} ${pad(m.fileVersion || '-', 18)} ${pad(T('mk.' + m.kind), 28)} ${m.path}`);
  if (d.unloaded.length) {
    L.push(section(T('h.unloaded') + ` (${d.unloaded.length})`));
    for (const u of d.unloaded) L.push(`  ${pad(u.name, 40)} ${hex(u.base, W)}  ${u.path}`);
  }
  if (d.comments.length) { L.push(section(T('h.comments'))); d.comments.forEach(c => L.push(c)); }
  if (d.warnings.length) { L.push(section(T('h.warnings'))); d.warnings.forEach(w => L.push(' - ' + w)); }
  L.push(section(T('r.limits')) + wrap(T('r.limitsText'), 78, ''));
  return L.join('\n').replace(/\r?\n/g, '\r\n') + '\r\n';
}

function buildCompareText(items, lang) {
  const T = (k, v) => t(lang, k, v), c = compare(items), L = [];
  L.push(T('r.cmpTitle') + ` (${c.rows.length})`, '='.repeat(40), T('r.generated', { v: VERSION }), '');
  L.push(`${pad(T('l.time'), 20)} ${pad(T('l.host'), 22)} ${pad(T('l.kind'), 16)} ${pad(T('l.code'), 12)} ${pad(T('l.culprit'), 34)} ${T('l.confidence')}`);
  L.push('-'.repeat(118));
  for (const r of c.rows) L.push(`${pad(fmtTime(r.time), 20)} ${pad(r.host, 22)} ${pad(T('kind.' + r.kind), 16)} ${pad(r.code || '-', 12)} ${pad(r.culprit || '-', 34)} ${T('conf.' + r.confidence)}`);
  L.push(section(T('h.fixFirst')));
  c.fixFirst.forEach((f, i) => L.push(`  ${pad(i + 1 + '.', 4)}${pad(f.module, 34)} ${pad(f.count + 'x', 5)} ${pad(fmtTime(f.last).slice(0, 10), 12)} ${T(f.action)}`));
  L.push(section(T('l.signature')));
  for (const r of c.rows) L.push(`  ${pad(fmtTime(r.time), 20)} ${pad(r.sig || '-', 14)} ${r.culprit || '-'}`);
  L.push(section(T('h.freq')));
  for (const [n, k, kind] of c.freq) L.push(`  ${pad(k + 'x', 5)} ${pad(n, 40)} ${T('mk.' + kind)}`);
  if (c.common.length) { L.push(section(T('h.common'))); for (const [n, k] of c.common) L.push(`  ${pad(k + '/' + c.rows.length, 7)} ${n}`); }
  L.push(section(T('h.cmpNotes')));
  for (const n of c.notes) L.push(' - ' + wrap(noteText(lang, n), 74, '   '));
  L.push(section(T('h.changes')));
  L.push(wrap(T('l.changesNote'), 78, ''), '');
  for (const ch of c.changes) {
    if (ch.baseline) { L.push(`  ${fmtTime(ch.time)}  ${T('l.baseline')}`); continue; }
    if (!ch.firstSeen.length && !ch.updated.length) continue;
    L.push(`  ${fmtTime(ch.time)}`);
    for (const u of ch.updated) L.push(`     ~ ${pad(u.name, 40)} ${u.from} -> ${u.to}`);
    for (const n of ch.firstSeen) L.push(`     + ${n}`);
  }
  if (c.versions.length) {
    L.push(section(T('h.versions')));
    for (const v of c.versions) {
      L.push('  ' + v.name);
      for (const e of v.events) L.push(`     ${pad(fmtTime(e.time), 20)} ${pad(e.ver, 18)} ${e.culprit ? '<< ' + T('l.culpritHere') : ''}`);
    }
  }
  return L.join('\n').replace(/\r?\n/g, '\r\n') + '\r\n';
}

/* ----------------------------------------------------------------------------
 * SUPPORT SUMMARY — always English (vendors' support teams), compact, factual.
 * ------------------------------------------------------------------------- */
function buildSupportText(d, a) {
  const T = (k, v) => t('en', k, v), W = a.ptrWidth, L = [], cm = a.culprit.module;
  const row = (k, v) => L.push(`${pad(k, 13)}: ${v}`);
  L.push(T('s.intro', { v: VERSION }), '');
  row('Application', `${a.hostLabel}${d.system ? ' (' + d.system.arch + ')' : ''}`);
  if (d.system) row('Windows', d.system.osName + (d.misc && d.misc.buildString ? '  ' + d.misc.buildString : ''));
  row('Dump time', fmtTime(a.dumpTime) + (a.uptimeSec !== undefined ? `  (uptime ${fmtDur(a.uptimeSec)})` : ''));
  row('Type', T('kind.' + a.kind));
  if (a.signature) row('Signature', `${a.signature.id}  (${a.signature.text})`);
  if (a.cxxType) row('C++ type', a.cxxType.type);
  if (a.exc) {
    let x = `${a.exc.codeHex} ${a.exc.name}`;
    if (a.av) x += ` — ${['read', 'write'][a.av.op] || (a.av.op === 8 ? 'execute' : 'access')} at ${hex(a.av.target, W)} (${a.av.category})`;
    row('Exception', x);
    row('Fault at', a.faultSym);
    if (a.instr) {
      row('Instruction', `${a.instr.asm}   [${a.instr.bytes}]`);
      if (a.instr.regs.length) row('Registers', a.instr.regs.map(r => `${r.name}=${hex(r.value, W)}`).join(', '));
    }
  }
  if (cm) {
    row('Module', `${cm.name}  version ${cm.fileVersion || '?'}`);
    if (cm.timestamp) row('Link time', `${fmtTime(cm.timestamp)}  (0x${(cm.timestamp >>> 0).toString(16).toUpperCase()})`);
    if (cm.pdb) row('PDB', `${cm.pdb.split(/[\\/]/).pop()}  ${cm.pdbId}`);
  }
  if (a.faultThread) row('Thread', `${a.faultThread.id}${a.faultThread.name ? ' "' + a.faultThread.name + '"' : ''} (${T('role.' + (a.faultRole || 'worker'))})`);
  if (a.activity && a.activity.length) row('Activity', a.activity.map(k => T('act.' + k)).join(', '));
  if (a.mem && a.mem.total) row('Memory', `process private ${fmtSize(a.mem.priv || 0)}, RAM free ${fmtSize(a.mem.avail)} of ${fmtSize(a.mem.total)}, commit ${a.mem.commitPct}%`);
  L.push('', `Stack (${a.frames.some(f => f.method === 'unwind') ? 'partly unwound with module files' : 'heuristic scan, no symbols'}):`);
  a.frames.slice(0, 24).forEach((f, i) => L.push(`  ${pad(i, 3)} ${f.sym}`));
  L.push('', 'Third-party modules loaded:');
  for (const m of a.thirdParty) L.push(`  ${pad(m.name, 40)} ${m.fileVersion || '-'}`);
  return L.join('\n').replace(/\r?\n/g, '\r\n') + '\r\n';
}

/* ----------------------------------------------------------------------------
 * ANONYMISER — removes Windows user names from exported text.
 *   1) "\Users\<name>\" (and "/Users/<name>/") -> "\Users\<user>\"
 *   2) every user name found in module paths, as a whole word -> "<user>"
 *   Built-in profiles (Public, Default, All Users) are left untouched.
 * ------------------------------------------------------------------------- */
function collectUserNames(dumps) {
  const set = new Set(), re = /[\\/]users[\\/]([^\\/]+)[\\/]/ig;
  for (const d of dumps) for (const p of [...d.modules.map(m => m.path), ...d.unloaded.map(u => u.path)]) {
    let m; re.lastIndex = 0;
    while ((m = re.exec(p))) if (!/^(public|default|default user|all users)$/i.test(m[1])) set.add(m[1]);
  }
  return [...set];
}
function anonymize(text, names) {
  let out = text.replace(/([\\/])users([\\/])([^\\/\r\n]+)/gi, (m, a, b, n) => (/^(public|default|default user|all users|<user>)$/i.test(n) ? m : `${a}Users${b}<user>`));
  for (const n of names || []) {
    if (n.length < 3) continue;
    const re = new RegExp('(^|[^A-Za-z0-9_])' + n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?![A-Za-z0-9_])', 'gi');
    out = out.replace(re, '$1<user>');
  }
  return out;
}


/* ----------------------------------------------------------------------------
 * PRIVACY TOKENS — what anonymize() must hide, collected from the loaded dumps:
 *   names: Windows user names found in "\Users\<name>\" of module paths;
 *   dirs : folders of module paths that are NOT standard Windows locations
 *          (C:\Windows, C:\Program Files, C:\Program Files (x86), C:\ProgramData),
 *          e.g. "D:\Samples\Kontakt\" — they reveal how the disk is organised.
 *   anonymize(text, tokens) replaces dirs (longest first) by "<folder>\" and then
 *   applies the user-name rules. tokens may also be a plain array of names (1.1.0).
 * ------------------------------------------------------------------------- */
const STD_DIR_RE = /^[a-z]:\\(windows|program files|program files \(x86\)|programdata)\\/i;
function privacyTokens(dumps) {
  const names = collectUserNames(dumps), dirs = new Set();
  for (const d of dumps) for (const p of [...d.modules.map(m => m.path), ...d.unloaded.map(u => u.path)]) {
    const dir = p.replace(/[^\\/]+$/, '');
    if (!dir) continue;
    if (STD_DIR_RE.test(dir) && !/\\users\\/i.test(dir)) continue;
    dirs.add(dir);
  }
  return { names, dirs: [...dirs].sort((x, y) => y.length - x.length) };
}
function anonymizeAll(text, tokens) {
  if (Array.isArray(tokens)) return anonymize(text, tokens);
  let out = text;
  for (const dir of tokens.dirs || []) out = out.split(dir).join('<folder>\\');
  return anonymize(out, tokens.names || []);
}

/* ----------------------------------------------------------------------------
 * PERSONAL NOTES — user annotations per module (optionally per version).
 *   File format (.json):
 *   { "format": "crash-dump-analyzer-notes", "version": 1,      (1.2.x wrote "crash-dump-viewer-notes")
 *     "notes": [ { "module": "Turnado.vst3", "version": "1.7.5.0" | "*", "text": "...", "date": "YYYY-MM-DD" } ] }
 *   Matching: module name case-insensitive; version "*" or empty = every version.
 * ------------------------------------------------------------------------- */
const NOTES_FORMATS = ['crash-dump-analyzer-notes', 'crash-dump-viewer-notes'];
function parseNotes(text) {
  const j = JSON.parse(text);
  // 'crash-dump-viewer-notes' = files exported by 1.2.x (before the rename): still accepted.
  if (!j || !NOTES_FORMATS.includes(j.format) || !Array.isArray(j.notes)) throw new Error('format');
  return j.notes.filter(n => n && typeof n.module === 'string' && typeof n.text === 'string')
    .map(n => ({ module: n.module, version: typeof n.version === 'string' ? n.version : '*', text: n.text.slice(0, 4000), date: String(n.date || '') }));
}
function serializeNotes(notes) {
  return JSON.stringify({ format: NOTES_FORMATS[0], version: 1, notes }, null, 2);
}
function notesFor(notes, m) {
  if (!notes || !m) return [];
  const n = m.name.toLowerCase();
  return notes.filter(x => x.module.toLowerCase() === n && (!x.version || x.version === '*' || x.version === m.fileVersion));
}
/** Notes of the culprit and of the other non-Windows modules seen on the stack. */
function notesForDump(notes, a) {
  if (!notes || !notes.length) return [];
  const mods = [a.culprit.module, ...a.suspects].filter(Boolean);
  const out = [];
  for (const m of mods) for (const n of notesFor(notes, m)) if (!out.includes(n)) out.push(n);
  return out;
}

/* ----------------------------------------------------------------------------
 * CSV / JSON EXPORT
 *   CSV: one row per dump, ';' separator (Excel with Spanish locale), RFC 4180 quoting.
 *   JSON: summary per dump + comparison (no raw memory). BigInt -> hex string.
 * ------------------------------------------------------------------------- */
function buildCSV(items) {
  const ok = items.filter(it => it.d && it.a).slice().sort((x, y) => x.d.header.timestamp - y.d.header.timestamp);
  const q = (v) => { const s = String(v ?? ''); return /[;"\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const head = ['dump_time','file','application','type','exception_code','exception_name','culprit','culprit_version','culprit_kind','vendor','confidence','reason',
                'signature','instruction','activity','process_private_mb','ram_available_pct','commit_pct','warnings','first_frame'];
  const L = [head.join(';')];
  ok.forEach(({ d, a }) => {
    const cm = a.culprit.module, M = a.mem || {};
    L.push([fmtTime(d.header.timestamp), d.fileName, a.hostLabel, a.kind, a.exc ? a.exc.codeHex : '', a.exc ? a.exc.name : '',
      cm ? cm.name : '', cm ? cm.fileVersion || '' : '', cm ? cm.kind : '', cm ? cm.vendor || '' : '', a.culprit.confidence, a.culprit.reason,
      a.signature ? a.signature.id : '', a.instr ? a.instr.asm : '', (a.activity || []).join(','), M.priv != null ? Math.round(M.priv / 1048576) : '', M.availPct ?? '', M.commitPct ?? '',
      (a.warnings || []).length, a.frames[0] ? a.frames[0].sym : ''].map(q).join(';'));
  });
  return L.join('\r\n') + '\r\n';
}
function buildJSON(items) {
  const c = compare(items);
  const ok = items.filter(it => it.d && it.a).slice().sort((x, y) => x.d.header.timestamp - y.d.header.timestamp);
  const mod = (m) => (m ? { name: m.name, version: m.fileVersion || '', kind: m.kind, vendor: m.vendor || '', linkTime: fmtTime(m.timestamp), path: m.path } : null);
  const out = {
    tool: 'Crash Dump Analyzer', toolVersion: VERSION,
    dumps: ok.map(({ d, a }) => ({
      file: d.fileName, time: fmtTime(d.header.timestamp), application: a.hostLabel, os: d.system ? d.system.osName : '', type: a.kind,
      exception: a.exc ? { code: a.exc.codeHex, name: a.exc.name, faultAt: a.faultSym, access: a.av ? { op: a.av.op, target: hex(a.av.target, a.ptrWidth), category: a.av.category } : null } : null,
      instruction: a.instr ? { asm: a.instr.asm, bytes: a.instr.bytes, registers: a.instr.regs.map(r => ({ name: r.name, value: hex(r.value, a.ptrWidth), category: r.cat })) } : null,
      signature: a.signature || null, cxxType: a.cxxType || null,
      culprit: mod(a.culprit.module), confidence: a.culprit.confidence, reason: a.culprit.reason,
      thread: a.faultThread ? { id: a.faultThread.id, name: a.faultThread.name, role: a.faultRole || '' } : null,
      activity: a.activity, uptimeSeconds: a.uptimeSec ?? null,
      memory: a.mem || null,
      warnings: (a.warnings || []).map(w => ({ key: w.key, text: t('en', w.key, w.vars) })),
      threads: a.threadsOv ? { total: a.threadsOv.total, waiting: a.threadsOv.wait, runningThirdParty: a.threadsOv.third.length, possibleDeadlock: !!a.deadlock } : null,
      frames: a.frames.slice(0, 32).map(f => ({ method: f.method || 'scan', symbol: f.sym })),
      thirdParty: a.thirdParty.map(m => ({ name: m.name, version: m.fileVersion || '', kind: m.kind }))
    })),
    comparison: { culpritFrequency: c.freq.map(([n, k]) => ({ module: n, count: k })), fixFirst: c.fixFirst.map(f => ({ module: f.module, crashes: f.count, last: fmtTime(f.last), action: t('en', f.action), score: f.score })),
                  changes: c.changes, notes: c.notes.map(n => noteText('en', n)) }
  };
  return JSON.stringify(out, (k, v) => (typeof v === 'bigint' ? '0x' + v.toString(16).toUpperCase() : v), 2) + '\n';
}



/* ----------------------------------------------------------------------------
 * 13. SELF-CONTAINED HTML REPORT (1.4.0) — used by "Export report (.html)" and by
 *     "Print / PDF". One generator, two uses:
 *       - export: full document with its own CSP (no scripts, no network), light theme;
 *       - print : the same body + CSS injected into #printArea, shown only in @media print.
 *     All CSS is scoped under .rp so it never touches the application UI.
 *     Anonymisation is applied to every TEXT value before HTML escaping, so the
 *     placeholders "<user>" / "<folder>" are rendered literally and safely.
 * ------------------------------------------------------------------------- */
const REPORT_CSS = `

.rp h1{font-size:20px;margin:0 0 4px}.rp h2{font-size:16px;margin:22px 0 8px;border-bottom:2px solid #d6dae0;padding-bottom:4px}
.rp h3{font-size:13px;margin:14px 0 6px;color:#5d6670;text-transform:uppercase;letter-spacing:.04em}
.rp .meta{color:#5d6670;font-size:12px}.rp .verdict{border-left:6px solid #2f6fd6;background:#eef3fc;padding:10px 12px;border-radius:6px;margin:8px 0}
.rp .verdict.crash{border-color:#c62828;background:#fdecec}.rp .verdict.hang{border-color:#b26a00;background:#fff4e0}
.rp .verdict b{font-size:15px}.rp table{border-collapse:collapse;width:100%;font-size:12px;margin:4px 0}
.rp th,.rp td{border-bottom:1px solid #e2e5ea;padding:4px 6px;text-align:left;vertical-align:top}.rp th{background:#f2f4f7}
.rp .mono{font-family:Consolas,"Cascadia Mono",Menlo,monospace;font-size:12px;word-break:break-all}.rp ul,.rp ol{margin:4px 0;padding-left:20px}
.rp .dump{page-break-before:always}.rp .dump:first-of-type{page-break-before:auto}.rp .foot{margin-top:24px;color:#5d6670;font-size:11px}
`;
function buildReportHTML(items, lang, notes, tokens) {
  const T = (k, v) => t(lang, k, v);

  const e = (x) => an(x).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ok = items.filter(it => it.d && it.a).slice().sort((x, y) => x.d.header.timestamp - y.d.header.timestamp);
  const row = (k, v) => `<tr><th style="width:190px">${e(k)}</th><td>${v}</td></tr>`;
  let b = `<h1>${e(T('r.htmlTitle'))}</h1><div class="meta">${e(T('r.htmlNote', { v: VERSION, anon: tokens ? T('l.yes') : T('l.no') }))}</div>`;
  if (ok.length > 1) {
    const c = compare(ok);
    b += `<h2>${e(T('h.cmp', { n: c.rows.length }))}</h2><table><tr><th>${e(T('l.time'))}</th><th>${e(T('l.host'))}</th><th>${e(T('l.kind'))}</th><th>${e(T('l.culprit'))}</th><th>${e(T('l.version'))}</th><th>${e(T('l.signature'))}</th></tr>`;
    for (const r of c.rows) b += `<tr><td>${e(fmtTime(r.time))}</td><td>${e(r.host)}</td><td>${e(T('kind.' + r.kind))}</td><td class="mono">${e(r.culprit || '-')}</td><td class="mono">${e(r.culpritVer)}</td><td class="mono">${e(r.sig)}</td></tr>`;
    b += `</table><h3>${e(T('h.fixFirst'))}</h3><table><tr><th>#</th><th>${e(T('l.module'))}</th><th>${e(T('l.crashes'))}</th><th>${e(T('l.lastSeen'))}</th><th>${e(T('l.action'))}</th></tr>`;
    c.fixFirst.forEach((f, i) => { b += `<tr><td>${i + 1}</td><td class="mono">${e(f.module)}</td><td>${f.count}</td><td>${e(fmtTime(f.last).slice(0, 10))}</td><td>${e(T(f.action))}</td></tr>`; });
    b += `</table><h3>${e(T('h.cmpNotes'))}</h3><ul>${c.notes.map(n => `<li>${e(noteText(lang, n))}</li>`).join('')}</ul>`;
  }
  for (const { d, a } of ok) {

const DUMP_RE = /\.(dmp|mdmp|hdmp)$/i, PE_RE = /\.(dll|vst3|exe|clap)$/i;
const PE_MAX = 768 * 2 ** 20;   // larger module files are skipped (whole file is read into memory)

/* ---------- file loading ---------- */
const fileKey = (f) => `${f.name}|${f.size}|${f.lastModified}`;
/** Route a mixed list of files: minidumps are analysed, module files (.dll/.vst3/.exe/.clap)
 *  are parsed as PE images and attached to every dump (exact build match), the rest ignored. */
async function loadFiles(files) {
  const dumps = files.filter(f => DUMP_RE.test(f.name));
  const pes = files.filter(f => PE_RE.test(f.name));
  for (const f of pes) {
    if (f.size > PE_MAX) { state.msgs.push(T('ui.peSkip', { name: f.name, msg: CDV.fmtSize(f.size) })); continue; }
    if (state.pe.some(P => P.key === fileKey(f))) continue;
    try {
      const P = CDV.parsePE(await f.arrayBuffer(), f.name);
      P.key = fileKey(f);
      state.pe.push(P);
    } catch (e) { state.msgs.push(T('ui.peSkip', { name: f.name, msg: e.message })); }
  }
  let added = 0;
  for (const f of dumps) {
    const key = fileKey(f);
    if (state.items.some(it => it.key === key)) continue;
    const item = { id: ++state.seq, file: f.name, key, d: null, a: null, error: null };
    state.items.push(item); added++;
    $('#main').innerHTML = `<div class="card">${esc(T('ui.loading', { name: f.name }))}</div>`;
    try {
      item.d = CDV.parseMinidump(await f.arrayBuffer(), f.name);
      CDV.attachPE(item.d, state.pe);
      item.a = CDV.analyze(item.d);
    } catch (e) {
      item.error = e.code === 'NOT_MINIDUMP' ? T('ui.notMdmp') : (e.message || String(e));
      console.error(e);
    }
    if (state.sel === null) state.sel = item.id;
  }
  // New module files: re-attach to every dump and re-analyse (frames may now be exact).
  if (pes.length) for (const it of state.items) if (it.d) { CDV.attachPE(it.d, state.pe); it.a = CDV.analyze(it.d); }
  if (added >= 2) state.sel = 'compare';
  else if (added === 1 && state.sel === 'compare' && state.items.filter(i => i.d).length < 2) state.sel = state.items[state.items.length - 1].id;
  render();
  return added;
}
function current() { return state.items.find(i => i.id === state.sel) || null; }

/** Recursively collect files from a drop that may contain folders (webkitGetAsEntry).
 *  Entries must be taken synchronously inside the drop event, before any await. */
function entriesFromDrop(dt) {
  return [...(dt.items || [])].map(i => (i.webkitGetAsEntry ? i.webkitGetAsEntry() : null)).filter(Boolean);
}
async function walkEntries(entries) {
  const out = [];
  async function walk(e) {
    if (e.isFile) { try { out.push(await new Promise((res, rej) => e.file(res, rej))); } catch (x) { /* unreadable */ } }
    else if (e.isDirectory) {
      const r = e.createReader(); let batch;
      do { batch = await new Promise((res, rej) => r.readEntries(res, rej)); for (const x of batch) await walk(x); } while (batch.length);
    }
  }
  for (const e of entries) await walk(e);
  return out;
}

/* ---------- watched folder (File System Access API: Chrome / Edge) ---------- */
async function watchFolder() {
  if (!window.showDirectoryPicker) { state.msgs.push(T('ui.watchNA')); render(); return; }
  try { state.dir = await window.showDirectoryPicker({ mode: 'read' }); } catch (e) { return; } // cancelled
  await rescan();
}
async function rescan() {
  if (!state.dir) return;
  const files = [];
  for await (const [name, h] of state.dir.entries()) if (h.kind === 'file' && (DUMP_RE.test(name) || PE_RE.test(name))) files.push(await h.getFile());
  const n = await loadFiles(files);
  if (!n) { state.msgs.push(T('ui.noNew') + ' ' + CDV.fmtTime(Math.floor(Date.now() / 1000))); state.msgs = state.msgs.slice(-4); applyStatic(); }
}

/** Copy text with the async clipboard API, falling back to a hidden textarea + execCommand. */
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* fallback below */ }
  const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();

/** Memory key/values with percentages; values over thresholds are highlighted. */

    [T('l.ws'), `${z(M.ws)} (${z(M.peakWs)})`],

    [T('l.commit'), flag(`${z(M.commit)} / ${z(M.commitLimit)}${M.commitPct !== undefined ? ` (${M.commitPct}%)` : ''}`, M.highCommit), true]

/** Exception tab: record, parameters, registers (symbolised), code bytes around IP. */
function renderExc(d, a) {

  if (!d.exception) return `<div class="card"><p>${esc(T(a.kind === 'hang' ? 'f.hang' : 'f.snapshot'))}</p></div>` + renderRegs(d, a, a.faultThread && a.faultThread.ctx);

    [T('l.code'), `${a.exc.codeHex} ${a.exc.name}`], ['', T(a.exc.descKey)],
    [T('l.address'), `${CDV.hex(ex.address, W)}  (${a.faultSym})`],
    [T('l.thread'), `${ex.threadId}${a.faultThread && a.faultThread.name ? ' "' + a.faultThread.name + '"' : ''} — ${T('role.' + (a.faultRole || 'worker'))}`],
    [T('l.flags'), CDV.hex(ex.flags, 8) + (ex.flags & 1 ? ' (EXCEPTION_NONCONTINUABLE)' : '')]
  ]) + `</div>`;
  if (ex.params.length) {
    h += `<div class="card"><h2>${esc(T('h.params'))}</h2><table><thead><tr><th>#</th><th>${esc(T('l.value'))}</th><th>${esc(T('l.points'))}</th></tr></thead><tbody>`;
    ex.params.forEach((p, i) => { const s = CDV.symbolize(d, p, W); h += `<tr><td>${i}</td><td class="mono">${CDV.hex(p, W)}</td><td class="mono">${s.module || s.unloaded ? esc(s.text) : ''}</td></tr>`; });
    h += `</tbody></table>`;
    const avF = a.findings.find(f => f.key.startsWith('f.av.'));
    if (avF) h += `<p>${esc(T(avF.key, avF.vars))}</p>`;
    h += `</div>`;
  }
  if (a.instr) {
    const I = a.instr;
    h += `<div class="card"><h2>${esc(T('h.instr'))}</h2>` + kv([
      [T('l.asm'), `<span class="mono">${esc(I.asm)}</span>`, true], [T('l.bytes'), `<span class="mono">${esc(I.bytes)}</span>`, true],
      [T('l.regsUsed'), I.regs.map(r => `${r.name.toUpperCase()} = ${CDV.hex(r.value, W)}`).join(', ')],
      [T('l.ea'), I.ea !== undefined ? `${CDV.hex(I.ea, W)}${I.eaMatches === null ? '' : ' — ' + T(I.eaMatches ? 'l.eaMatch' : 'l.eaNoMatch')}` : '']
    ]) + `<ul class="clean">${a.findings.filter(f => f.key.startsWith('f.instr.')).map(f => `<li>${esc(T(f.key, f.vars))}</li>`).join('')}</ul></div>`;
  }
  h += renderRegs(d, a, a.faultCtx);

  if (a.faultCtx && a.faultCtx.ip) {
    const ip = a.faultCtx.ip, before = 32n;
    let bytes = CDV.readCode(d, ip - before, 64), base = ip - before;
    if (!bytes) { bytes = CDV.readCode(d, ip, 32); base = ip; }
    h += `<div class="card"><h2>${esc(T('h.code'))}</h2>`;
    if (bytes) {
      let txt = '';
      for (let i = 0; i < bytes.length; i += 16) {

        txt += CDV.hex(addr, W) + '  ' + Array.from(bytes.subarray(i, i + 16)).map((b, j) => (base + BigInt(i + j) === ip ? '[' : ' ') + b.toString(16).padStart(2, '0').toUpperCase()).join('') + '\n';
      }

    } else h += `<p class="muted">${esc(T('l.notCaptured'))}</p>`;
    h += `</div>`;
  }
  return h;
}
function renderRegs(d, a, ctx) {

  for (const [n, v] of ctx.regs) { const s = CDV.symbolize(d, v, a.ptrWidth); h += `<tr><td class="mono">${n}</td><td class="mono">${CDV.hex(v, a.ptrWidth)}</td><td class="mono">${s.module || s.unloaded ? esc(s.text) : ''}</td></tr>`; }
  return h + `</tbody></table></div>`;
}

/** Stack tab: thread selector + frames (exact unwind where module files are loaded, else scan). */
function renderStack(d, a) {
  const tid = state.stackTid ?? (a.faultThread ? a.faultThread.id : d.threads[0] && d.threads[0].id);
  const th = d.threads.find(t => t.id === tid);
  const useExcCtx = d.exception && th && th.id === d.exception.threadId;
  const frames = th ? (a.faultThread && th.id === a.faultThread.id ? a.frames : CDV.scanStack(d, th, useExcCtx ? a.faultCtx : th.ctx)) : [];
  const opts = d.threads.map(t => {
    const mark = a.faultThread && t.id === a.faultThread.id ? (d.exception ? ' ⚠' : ' ★') : (a.mainThread && t.id === a.mainThread.id ? ' ★' : '');
    return `<option value="${t.id}" ${t.id === tid ? 'selected' : ''}>${t.id}${t.name ? ' — ' + esc(t.name) : ''}${mark}</option>`;
  }).join('');
  let h = `<div class="card"><h2>${esc(T('h.stack'))}</h2><div class="toolbar"><label>${esc(T('l.selThread'))} <select id="stackSel">${opts}</select></label></div>
    <p class="muted">${esc(T(frames.some(f => f.method === 'unwind') ? 'f.unwound' : 'f.heuristic', { n: frames.filter(f => f.method === 'unwind').length }))}</p>`;
  if (!frames.length) return h + `<p>${esc(T('l.notCaptured'))}</p></div>`;
  h += `<div class="tablewrap"><table><thead><tr><th>${esc(T('l.frame'))}</th><th>${esc(T('l.stackAddr'))}</th><th>${esc(T('l.module'))}+offset</th><th>${esc(T('l.kind'))}</th><th>${esc(T('l.method'))}</th><th>${esc(T('l.check'))}</th></tr></thead><tbody>`;
  frames.forEach((f, i) => {
    const k = f.module ? f.module.kind : '';
    const chk = f.method === 'unwind' || f.where === 'ip' ? '' : f.call === true ? T('check.yes') : f.call === false ? T('check.no') : T('check.na');
    h += `<tr class="k-${k} ${a.culprit.module && f.module === a.culprit.module ? 'hl' : ''}"><td>${i}</td><td class="mono">${f.stackAddr ? CDV.hex(f.stackAddr, a.ptrWidth) : '[IP]'}</td><td class="mono">${esc(f.sym)}</td><td>${k ? esc(T('mk.' + k)) : ''}</td><td>${esc(T('m.' + (f.method || 'scan')))}</td><td class="muted">${esc(chk)}</td></tr>`;
  });
  return h + `</tbody></table></div></div>`;
}

/** Timeline: one lane per application version, one dot per dump (red crash, amber freeze). */
function timelineSVG(rows) {
  if (!rows.length) return '';
  const lanes = [...new Set(rows.map(r => r.host))];
  const W = 900, left = 170, right = 70, laneH = 46, top = 24, H = top + lanes.length * laneH + 28;
  const t0 = rows[0].time, t1 = rows[rows.length - 1].time, span = Math.max(1, t1 - t0);
  const x = (t) => left + (rows.length === 1 ? 0.5 : (t - t0) / span) * (W - left - right);
  let g = '';
  lanes.forEach((l, i) => {
    const y = top + i * laneH + laneH / 2;
    g += `<line class="lane" x1="${left}" x2="${W - right}" y1="${y}" y2="${y}"/><text x="8" y="${y + 4}">${esc(l)}</text>`;
  });
  const lastX = new Map(), flip = new Map();   // per lane: x of previous dot, label side
  for (const r of rows) {
    const y = top + lanes.indexOf(r.host) * laneH + laneH / 2, cx = x(r.time);
    // Dots closer than 90 px in the same lane alternate their label above / below.
    const near = lastX.has(r.host) && cx - lastX.get(r.host) < 90;
    const below = near ? !flip.get(r.host) : false;
    lastX.set(r.host, cx); flip.set(r.host, below);
    const color = r.kind === 'crash' ? 'var(--crash)' : r.kind === 'hang' ? 'var(--hang)' : 'var(--accent)';
    const lab = (r.culprit || '-').replace(/\.(vst3|dll)$/i, '');
    g += `<circle cx="${cx.toFixed(1)}" cy="${y}" r="7" style="fill:${color}"><title>${esc(CDV.fmtTime(r.time))} · ${esc(T('kind.' + r.kind))} · ${esc(r.culprit || '-')}</title></circle>`;
    g += `<text x="${cx.toFixed(1)}" y="${below ? y + 20 : y - 11}" text-anchor="middle">${esc(lab.length > 16 ? lab.slice(0, 15) + '…' : lab)}</text>`;
  }
  g += `<text x="${left}" y="${H - 8}">${esc(CDV.fmtTime(t0).slice(0, 10))}</text><text x="${W - right}" y="${H - 8}" text-anchor="end">${esc(CDV.fmtTime(t1).slice(0, 10))}</text>`;
  return `<svg class="timeline" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(T('h.timeline'))}">${g}</svg>`;
}

/** Comparison view across all successfully parsed dumps. */
function renderCompare() {
  const items = state.items.filter(i => i.d);
  const c = CDV.compare(items);
  let h = `<div class="card"><h2>${esc(T('h.timeline'))}</h2>${timelineSVG(c.rows)}</div>`;
  h += `<div class="card"><h2>${esc(T('h.fixFirst'))}</h2><div class="tablewrap"><table><thead><tr><th>${esc(T('l.rank'))}</th><th>${esc(T('l.module'))}</th><th>${esc(T('l.kind'))}</th><th>${esc(T('l.crashes'))}</th><th>${esc(T('l.lastSeen'))}</th><th>${esc(T('l.action'))}</th></tr></thead><tbody>`;
  c.fixFirst.forEach((f, i) => { h += `<tr class="${i === 0 ? 'hl' : ''}"><td>${i + 1}</td><td class="mono">${esc(f.module)}</td><td>${f.kind ? esc(T('mk.' + f.kind)) : ''}</td><td>${f.count}</td><td>${esc(CDV.fmtTime(f.last).slice(0, 10))}</td><td>${esc(T(f.action))}</td></tr>`; });
  h += `</tbody></table></div></div>`;
  h += `<div class="card"><h2>${esc(T('h.cmp', { n: c.rows.length }))}</h2><div class="tablewrap"><table><thead><tr>
    <th>${esc(T('l.time'))}</th><th>${esc(T('l.host'))}</th><th>${esc(T('l.kind'))}</th><th>${esc(T('l.code'))}</th><th>${esc(T('l.culprit'))}</th><th>${esc(T('l.version'))}</th><th>${esc(T('l.kind'))}</th><th>${esc(T('l.confidence'))}</th><th>${esc(T('l.signature'))}</th><th>${esc(T('l.file'))}</th></tr></thead><tbody>`;
  for (const r of c.rows) h += `<tr><td>${esc(CDV.fmtTime(r.time))}</td><td>${esc(r.host)}</td><td>${esc(T('kind.' + r.kind))}</td><td class="mono">${esc(r.code)} ${esc(r.codeName)}</td>
    <td class="mono">${esc(r.culprit || '-')}${r.culprit && state.notes.some(n => n.module.toLowerCase() === r.culprit.toLowerCase()) ? ' 📝' : ''}</td><td class="mono">${esc(r.culpritVer)}</td><td>${r.culpritKind ? esc(T('mk.' + r.culpritKind)) : ''}</td><td>${pill(T('conf.' + r.confidence), r.confidence)}</td><td class="sig">${esc(r.sig)}</td><td class="mono muted">${esc(r.file)}</td></tr>`;
  h += `</tbody></table></div></div>`;
  h += `<div class="card"><h2>${esc(T('h.cmpNotes'))}</h2><ul class="clean">${c.notes.map(n => `<li>${esc(CDV.noteText(state.lang, n))}</li>`).join('')}</ul></div>`;
  const max = Math.max(1, ...c.freq.map(f => f[1]));
  h += `<div class="card"><h2>${esc(T('h.freq'))}</h2>${c.freq.map(([n, k, kind]) => `<div><span class="bar" style="width:${Math.round(k / max * 160)}px"></span><b>${k}×</b> <span class="mono">${esc(n)}</span> ${pill(T('mk.' + kind))}</div>`).join('') || esc(T('l.none'))}</div>`;
  h += `<div class="card"><h2>${esc(T('h.changes'))}</h2><p class="muted">${esc(T('l.changesNote'))}</p><div class="tablewrap" style="max-height:50vh"><table><thead><tr><th>${esc(T('l.time'))}</th><th>${esc(T('l.updated'))}</th><th>${esc(T('l.firstSeen'))}</th></tr></thead><tbody>`;
  for (const ch of c.changes) {
    if (ch.baseline) { h += `<tr><td>${esc(CDV.fmtTime(ch.time))}</td><td colspan="2" class="muted">${esc(T('l.baseline'))}</td></tr>`; continue; }
    if (!ch.firstSeen.length && !ch.updated.length) continue;
    h += `<tr><td>${esc(CDV.fmtTime(ch.time))}</td><td class="mono">${ch.updated.map(u => `${esc(u.name)} <span class="muted">${esc(u.from)} → </span>${esc(u.to)}`).join('<br>')}</td><td class="mono">${ch.firstSeen.map(esc).join('<br>')}</td></tr>`;
  }
  h += `</tbody></table></div></div>`;
  if (c.versions.length) {
    h += `<div class="card"><h2>${esc(T('h.versions'))}</h2><div class="tablewrap" style="max-height:50vh"><table><thead><tr><th>${esc(T('l.module'))}</th><th>${esc(T('l.time'))}</th><th>${esc(T('l.version'))}</th><th></th></tr></thead><tbody>`;
    for (const v of c.versions) v.events.forEach((e, i) => {
      h += `<tr class="${e.culprit ? 'hl' : ''}"><td class="mono">${i ? '' : esc(v.name)}</td><td>${esc(CDV.fmtTime(e.time))}</td><td class="mono">${esc(e.ver)}</td><td>${e.culprit ? pill(T('l.culpritHere'), 'high') : ''}</td></tr>`;
    });
    h += `</tbody></table></div></div>`;
  }
  if (c.common.length) h += `<div class="card"><h2>${esc(T('h.common'))}</h2><div class="tablewrap" style="max-height:40vh"><table><thead><tr><th>${esc(T('l.module'))}</th><th>${esc(T('l.inDumps'))}</th></tr></thead><tbody>${c.common.map(([n, k]) => `<tr><td class="mono">${esc(n)}</td><td>${k} / ${c.rows.length}</td></tr>`).join('')}</tbody></table></div></div>`;
  return h;
}

/* ---------- export (.txt, UTF-8 with BOM so Notepad shows accents; optional anonymisation) ---------- */
/** Anonymisation for everything that leaves the page: user names + non-standard folders. */
function finalText(text) {
  return state.anon ? CDV.anonymizeAll(text, CDV.privacyTokens(state.items.filter(i => i.d).map(i => i.d))) : text;
}
function download(name, text, mime, raw) {
  const body = raw ? text : finalText(text);
  const blob = new Blob([mime === 'application/json' || mime === 'text/html' ? body : '\uFEFF' + body], { type: (mime || 'text/plain') + ';charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function exportOne() {
  if (state.sel === 'compare') { download('crash-dump-comparison.txt', CDV.buildCompareText(state.items.filter(i => i.d), state.lang)); return; }
  const it = current(); if (!it || !it.d) return;
  download(it.file.replace(/\.[^.]+$/, '') + '.report.txt', CDV.buildTextReport(it.d, it.a, state.lang, state.notes));
}
function exportAll() {
  const ok = state.items.filter(i => i.d).sort((x, y) => x.d.header.timestamp - y.d.header.timestamp);
  if (!ok.length) return;
  let txt = CDV.buildCompareText(ok, state.lang);
  for (const it of ok) txt += '\r\n\r\n' + '#'.repeat(78) + '\r\n\r\n' + CDV.buildTextReport(it.d, it.a, state.lang, state.notes);
  download('crash-dump-reports.txt', txt);
}
/** Items covered by the current selection: one dump, or all of them in the comparison view. */
function selectedItems() {
  if (state.sel === 'compare') return state.items.filter(i => i.d);
  const it = current(); return it && it.d ? [it] : [];
}
function reportTokens() { return state.anon ? CDV.privacyTokens(state.items.filter(i => i.d).map(i => i.d)) : null; }
function exportHTML() {
  const sel = selectedItems(); if (!sel.length) return;
  const r = CDV.buildReportHTML(sel, state.lang, state.notes, reportTokens());
  const name = sel.length > 1 ? 'crash-dump-report.html' : sel[0].file.replace(/\.[^.]+$/, '') + '.report.html';
  download(name, r.html, 'text/html', true);   // already anonymised inside the builder
}
function printReport() {
  const sel = selectedItems(); if (!sel.length) return;
  const r = CDV.buildReportHTML(sel, state.lang, state.notes, reportTokens());
  $('#printArea').innerHTML = `<style>${r.css}</style>${r.body}`;
  window.print();
}

function loadDemo() {

function exportCSV() { download('crash-dumps.csv', CDV.buildCSV(state.items.filter(i => i.d)), 'text/csv'); }
function exportJSON() { download('crash-dumps.json', CDV.buildJSON(state.items.filter(i => i.d)), 'application/json'); }

/* ---------- personal notes (memory only; import/export as .json) ---------- */
async function importNotes(file) {
  try {
    const list = CDV.parseNotes(await file.text());
    for (const n of list) if (!state.notes.some(x => x.module === n.module && x.version === n.version && x.text === n.text)) state.notes.push(n);
    state.msgs.push(T('ui.notesLoaded', { n: list.length }));
  } catch (e) { state.msgs.push(T('ui.notesBad', { msg: e.message })); }
  render();
}
function exportNotes() { download('crash-dump-analyzer-notes.json', CDV.serializeNotes(state.notes), 'application/json', true); }
function addNote() {
  const it = current(); if (!it || !it.d) return;
  const sel = $('#noteModule'), txt = $('#noteText'), only = $('#noteOnlyVer');
  const m = it.d.modules.find(x => x.name === sel.value); if (!m || !txt.value.trim()) return;
  const now = new Date(), p2 = (n) => String(n).padStart(2, '0');
  state.notes.push({ module: m.name, version: only.checked ? (m.fileVersion || '*') : '*', text: txt.value.trim(),
                     date: `${now.getFullYear()}-${p2(now.getMonth() + 1)}-${p2(now.getDate())}` });
  render();
}

$('#btnPrint').onclick = printReport;
$('#btnDemo').onclick = loadDemo;
$('#btnJSON').onclick = exportJSON;
$('#btnNotesIn').onclick = () => $('#notesInput').click();
$('#notesInput').onchange = (e) => { if (e.target.files[0]) importNotes(e.target.files[0]); e.target.value = ''; };
$('#btnNotesOut').onclick = exportNotes;
$('#btnExportAll').onclick = exportAll;
// Clear removes dumps and module files; notes are kept (export them to save them).
$('#btnClear').onclick = () => { state.items = []; state.pe = []; state.sel = null; state.stackTid = null; state.msgs = []; render(); };
$('#langSeg').onclick = (e) => { const b = e.target.closest('button'); if (b) { state.lang = b.dataset.lang; render(); } };
$('#list').onclick = (e) => { const el = e.target.closest('.list-item'); if (!el) return; state.sel = el.dataset.id === 'compare' ? 'compare' : Number(el.dataset.id); state.stackTid = null; render(); };
$('#main').addEventListener('click', (e) => {
  const b = e.target.closest('.tabs button'); if (b) { state.tab = b.dataset.tab; render(); return; }
  if (e.target.id === 'btnCopy') copySupport();
  if (e.target.id === 'btnAddNote') addNote();
  if (e.target.dataset && e.target.dataset.demo) loadDemo();
  if (e.target.dataset && e.target.dataset.delnote !== undefined) { state.notes.splice(Number(e.target.dataset.delnote), 1); render(); }
});
$('#main').addEventListener('change', (e) => {
  if (e.target.id === 'stackSel') { state.stackTid = Number(e.target.value); render(); }
  if (e.target.id === 'hideSys') { state.hideSys = e.target.checked; render(); }
});
$('#main').addEventListener('input', (e) => {
  if (e.target.id === 'modFilter') {
    state.modFilter = e.target.value; const pos = e.target.selectionStart; render();
    const f = $('#modFilter'); if (f) { f.focus(); f.setSelectionRange(pos, pos); }
  }
});
// Drag & drop anywhere on the page: files, folders (recursively) and module files.
let dragDepth = 0;
window.addEventListener('dragenter', (e) => { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
window.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', async (e) => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
  const entries = entriesFromDrop(e.dataTransfer);           // synchronous, before any await
  const files = entries.length ? await walkEntries(entries) : [...(e.dataTransfer.files || [])];
  if (files.length) loadFiles(files);
});
// English is the default language; Spanish via the EN/ES switch.
render();
})();
</script>
</body>
</html>
