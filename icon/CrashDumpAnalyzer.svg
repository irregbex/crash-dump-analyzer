<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b4a8a"/><stop offset="1" stop-color="#121a33"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ad0ff"/><stop offset="1" stop-color="#9f8cff"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity=".12"/>
  <!-- audio waveform, alive on the left -->
  <path d="M8 32 L13 32 L16 22 L20 42 L24 16 L28 40 L31 30" fill="none" stroke="url(#wave)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- crash: red jagged break -->
  <path d="M31 30 L35 24 L33 33 L38 29" fill="none" stroke="#ff4d5e" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- flat line after the crash -->
  <path d="M38 29 L41 32" fill="none" stroke="#8a93a8" stroke-width="3" stroke-linecap="round"/>
  <!-- magnifier over the right side -->
  <circle cx="44" cy="42" r="9" fill="#0f172b" fill-opacity=".55" stroke="#e8edf7" stroke-width="3.4"/>
  <path d="M38.5 42 h3 l1.6 -3.4 l2 6.8 l1.4 -3.4 h2" fill="none" stroke="#ff4d5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M50.6 48.6 L56 54" stroke="#e8edf7" stroke-width="4.4" stroke-linecap="round"/>
</svg>
